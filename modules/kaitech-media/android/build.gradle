plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.kaitech.media'
version = '0.1.0'

android {
  namespace "io.kaitech.media"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  implementation project(':expo-modules-core')
}

name: Build

on:
  workflow_call:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  KAITECH_LINK_HOST: ${{ vars.KAITECH_LINK_HOST }}
  KAITECH_DEFAULT_DB: ${{ vars.KAITECH_DEFAULT_DB }}

jobs:
  android-e2e:
    name: android apk x86_64 (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_ABIS: x86_64
      APK_VARIANT: x86_64
      APK_ARTIFACT: e2e-apk-x86_64
    steps: &android-apk-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: ./.github/actions/setup-gitleaks
      - id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-android-${{ env.APK_VARIANT }}-${{ hashFiles('package-lock.json', 'app.json', 'app.config.ts') }}
          restore-prefix: ccache-android-${{ env.APK_VARIANT }}-
      - run: npm ci
      - name: Build number
        run: echo "APP_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - name: google-services.json from secret (optional)
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_CONTENT" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > "$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
            echo "Push enabled: google-services.json provided."
          else
            echo "Push disabled: GOOGLE_SERVICES_JSON secret not set."
          fi
      - run: npx expo prebuild --platform android --no-install
      - name: Release keystore from secret (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; APK is signed with the generated debug key and cannot update an installed release APK."
          fi
      - name: Assemble release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          set -euo pipefail
          signing=()
          if [ -n "${RELEASE_KEYSTORE:-}" ]; then
            signing=(
              "-Pandroid.injected.signing.store.file=$RELEASE_KEYSTORE"
              "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
            )
          fi
          ./gradlew --no-daemon --build-cache "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" \
            assembleRelease "-PreactNativeArchitectures=$APK_ABIS" "${signing[@]}"
      - name: ccache statistics
        run: ccache --show-stats
      - if: github.event_name != 'pull_request' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ccache.outputs.dir }}
          key: ${{ steps.ccache.outputs.key }}
      - name: Verify signing certificate
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner"
          certs="$("$apksigner" verify --verbose --print-certs "$apk")"
          echo "$certs" | grep -E '^(Verified using|Signer|Number of signers)'
          actual="$(echo "$certs" | grep -m1 -E 'certificate SHA-256 digest:' | sed -E 's/.*digest: //' | tr -d ': ' | tr 'a-f' 'A-F')"
          [ -n "$actual" ] || { echo "::error::apksigner printed no certificate digest"; exit 1; }
          expected="$(tr -d ': \n' < .github/android-release-cert.sha256 | tr 'a-f' 'A-F')"
          echo "APK certificate SHA-256: $actual"
          if [ -n "${RELEASE_KEYSTORE:-}" ]; then
            [ "$actual" = "$expected" ] || { echo "::error::APK certificate does not match .github/android-release-cert.sha256"; exit 1; }
            echo "SIGN_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "SIGN_SUFFIX=-debugkey" >> "$GITHUB_ENV"
          fi
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Scan bundled JS for secrets
        run: |
          set -euo pipefail
          unzip -q android/app/build/outputs/apk/release/app-release.apk 'assets/*' -d "$RUNNER_TEMP/apk"
          gitleaks dir --redact --verbose --exit-code 1 "$RUNNER_TEMP/apk/assets"
      - name: APK holds only the requested ABIs
        run: |
          set -euo pipefail
          actual="$(unzip -Z1 android/app/build/outputs/apk/release/app-release.apk 'lib/*' | cut -d/ -f2 | sort -u | paste -sd, -)"
          expected="$(tr ',' '\n' <<< "$APK_ABIS" | sort -u | paste -sd, -)"
          echo "APK ABIs: $actual"
          [ "$actual" = "$expected" ] || { echo "::error::APK holds ABIs $actual, expected $expected"; exit 1; }
      - name: Name artifact
        run: |
          mkdir -p dist
          suffix=""
          if [ "$APK_VARIANT" != universal ]; then suffix="-$APK_VARIANT"; fi
          cp android/app/build/outputs/apk/release/app-release.apk "dist/kaitech-${APP_BUILD_NUMBER}-${SOURCE_SHA::7}${suffix}${SIGN_SUFFIX}.apk"
          (cd dist && sha256sum ./*.apk | tee "SHA256SUMS-android-$APK_VARIANT.txt")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Performance gate (APK and JS bundle size)
        id: perf
        run: |
          set -euo pipefail
          node scripts/perf-gate.mjs --out "perf-output/android-$APK_VARIANT.json" \
            "android.apk_${APK_VARIANT}_bytes=$(wc -c < android/app/build/outputs/apk/release/app-release.apk)" \
            "android.js_bundle_bytes=$(wc -c < "$RUNNER_TEMP/apk/assets/index.android.bundle")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.perf.outcome != 'skipped'
        with:
          name: perf-android-${{ env.APK_VARIANT }}
          path: perf-output/
          if-no-files-found: warn
          retention-days: 90

  android:
    name: android apk
    if: &release-apk-refs github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_ABIS: armeabi-v7a,arm64-v8a,x86,x86_64
      APK_VARIANT: universal
      APK_ARTIFACT: kaitech-android-apk
    steps: *android-apk-steps

  android-arm64:
    name: android apk arm64-v8a
    if: *release-apk-refs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_ABIS: arm64-v8a
      APK_VARIANT: arm64-v8a
      APK_ARTIFACT: kaitech-android-apk-arm64-v8a
    steps: *android-apk-steps

  ios:
    name: ios ipa (unsigned)
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pods
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/ReactNative
          key: ios-downloads-${{ hashFiles('package-lock.json', 'app.json', 'app.config.ts') }}
          restore-keys: ios-downloads-
      - run: npm ci
      - name: Toolchain
        run: |
          xcodebuild -version
          pod --version
      - name: Build number
        run: echo "APP_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - run: npx expo prebuild --platform ios
      - if: github.event_name != 'pull_request' && steps.pods.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/ReactNative
          key: ${{ steps.pods.outputs.cache-primary-key }}
      - name: xcodebuild (no code signing)
        run: |
          mkdir -p build
          if ! xcodebuild \
            -workspace ios/Kaitech.xcworkspace \
            -scheme Kaitech \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1; then
            grep -E 'error:' build/xcodebuild.log | head -50 || true
            tail -100 build/xcodebuild.log
            exit 1
          fi
          grep -E '^\*\* BUILD' build/xcodebuild.log
      - name: Package IPA
        run: |
          set -euo pipefail
          app=build/ios/Build/Products/Release-iphoneos/Kaitech.app
          test -f "$app/main.jsbundle"
          mkdir -p ipa/Payload dist
          cp -R "$app" ipa/Payload/
          ipa_name="kaitech-${APP_BUILD_NUMBER}-${SOURCE_SHA::7}-unsigned.ipa"
          (cd ipa && zip -qry "../dist/$ipa_name" Payload)
          (cd dist && shasum -a 256 ./*.ipa | tee SHA256SUMS-ios.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kaitech-ios-ipa
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Performance gate (IPA and JS bundle size)
        id: perf
        run: |
          set -euo pipefail
          ipa="$(find dist -maxdepth 1 -name '*.ipa' | head -1)"
          node scripts/perf-gate.mjs --out perf-output/ios.json \
            "ios.ipa_bytes=$(wc -c < "$ipa" | tr -d ' ')" \
            "ios.js_bundle_bytes=$(wc -c < build/ios/Build/Products/Release-iphoneos/Kaitech.app/main.jsbundle | tr -d ' ')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.perf.outcome != 'skipped'
        with:
          name: perf-ios
          path: perf-output/
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ios-build-log
          path: build/xcodebuild.log
          retention-days: 7

  ios-bundle-scan:
    name: ios bundle secret scan
    needs: ios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gitleaks
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kaitech-ios-ipa
          path: dist
      - run: |
          set -euo pipefail
          unzip -q dist/*.ipa 'Payload/Kaitech.app/main.jsbundle' -d "$RUNNER_TEMP/ipa"
          gitleaks dir --redact --verbose --exit-code 1 "$RUNNER_TEMP/ipa"

  e2e-android-cell:
    name: e2e android ${{ matrix.size }} ${{ matrix.orientation }} ${{ matrix.locale }}
    needs: android-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_APK_ARTIFACT: e2e-apk-x86_64
      E2E_LABEL: ''
    strategy:
      fail-fast: false
      matrix:
        size: [phone, tablet]
        orientation: [portrait, landscape]
        locale: [en-US, id-ID]
        include:
          - size: phone
            profile: pixel_6
          - size: tablet
            profile: pixel_tablet
          - size: phone
            orientation: portrait
            locale: en-US
            cold_start: 5
    steps: &e2e-android-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.E2E_APK_ARTIFACT }}
          path: dist
      - uses: ./.github/actions/setup-maestro
      - uses: ./.github/actions/setup-gitleaks
      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          COLD_START_RUNS: ${{ matrix.cold_start || 0 }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/e2e-android.sh dist e2e-output/${{ env.E2E_LABEL }}${{ matrix.size }}-${{ matrix.orientation }}-${{ matrix.locale }} ${{ matrix.locale }} ${{ matrix.size }} ${{ matrix.orientation }}
      - name: Scan E2E output for secrets
        id: scan-e2e
        if: always()
        run: |
          if [ ! -d e2e-output ]; then
            echo "no E2E output"
            exit 0
          fi
          gitleaks dir --redact --verbose --exit-code 1 e2e-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-e2e.outcome == 'success'
        with:
          name: e2e-android-${{ env.E2E_LABEL }}${{ matrix.size }}-${{ matrix.orientation }}-${{ matrix.locale }}
          path: e2e-output/
          if-no-files-found: warn
          retention-days: 30

  e2e-android-rows:
    name: e2e android rows ${{ matrix.size }} ${{ matrix.locale }}
    needs: android-e2e
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: kaitech-e2e-account
      cancel-in-progress: false
      queue: max
    env:
      E2E_APK_ARTIFACT: e2e-apk-x86_64
      E2E_LABEL: rows-
      E2E_FLOWS: .maestro/signed-in/rows-chat.yaml .maestro/signed-in/rows-discovery.yaml .maestro/signed-in/rows-mom.yaml
      E2E_LOGIN: ${{ secrets.KAITECH_E2E_LOGIN }}
      E2E_PASSWORD: ${{ secrets.KAITECH_E2E_PASSWORD }}
      E2E_WEB_LOGIN: ${{ secrets.KAITECH_E2E_WEB_LOGIN }}
      E2E_WEB_PASSWORD: ${{ secrets.KAITECH_E2E_WEB_PASSWORD }}
      E2E_SERVER: ${{ vars.KAITECH_LINK_HOST }}
      E2E_DB: ${{ vars.KAITECH_DEFAULT_DB }}
      E2E_CHANNEL_ID: ${{ vars.KAITECH_E2E_CHANNEL_ID }}
      E2E_PEER: ${{ vars.KAITECH_E2E_PEER }}
      E2E_PROGRAMME: ${{ vars.KAITECH_E2E_PROGRAMME }}
      E2E_SEARCH: ${{ vars.KAITECH_E2E_SEARCH }}
      E2E_HIDE_DIRECT: ${{ matrix.hide_direct || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        size: [phone, tablet]
        orientation: [portrait]
        locale: [en-US, id-ID]
        include:
          - size: phone
            profile: pixel_6
          - size: tablet
            profile: pixel_tablet
          - size: phone
            locale: en-US
            hide_direct: 'true'
    steps: *e2e-android-steps

  e2e-android-universal:
    name: e2e android universal apk
    needs: android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_APK_ARTIFACT: kaitech-android-apk
      E2E_LABEL: universal-
    strategy:
      matrix:
        include:
          - size: phone
            orientation: portrait
            locale: en-US
            profile: pixel_6
            cold_start: 0
    steps: *e2e-android-steps

  e2e-android:
    name: e2e android ${{ matrix.locale }}
    needs: [e2e-android-cell, e2e-android-rows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        locale: [en-US, id-ID]
    steps:
      - name: Every phone and tablet cell passed
        env:
          CELLS: ${{ needs.e2e-android-cell.result }}
          ROWS: ${{ needs.e2e-android-rows.result }}
        run: |
          echo "e2e android cells: $CELLS, signed-in rows: $ROWS"
          [ "$CELLS" = success ]
          [ "$ROWS" = success ] || [ "$ROWS" = skipped ]

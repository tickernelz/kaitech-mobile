name: Build

on:
  workflow_call:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  android:
    name: android apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: ./.github/actions/setup-gitleaks
      - run: npm ci
      - name: Build number
        run: echo "APP_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - name: google-services.json from secret (optional)
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_CONTENT" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > "$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
            echo "Push enabled: google-services.json provided."
          else
            echo "Push disabled: GOOGLE_SERVICES_JSON secret not set."
          fi
      - run: npx expo prebuild --platform android --no-install
      - name: Release keystore from secret (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; APK is signed with the generated debug key and cannot update an installed release APK."
          fi
      - name: Assemble release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signing=()
          if [ -n "${RELEASE_KEYSTORE:-}" ]; then
            signing=(
              "-Pandroid.injected.signing.store.file=$RELEASE_KEYSTORE"
              "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
            )
          fi
          abis=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            abis=("-PreactNativeArchitectures=arm64-v8a,x86_64")
          fi
          ./gradlew --no-daemon assembleRelease "${signing[@]}" "${abis[@]}"
      - name: Verify signing certificate
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner"
          certs="$("$apksigner" verify --verbose --print-certs "$apk")"
          echo "$certs" | grep -E '^(Verified using|Signer|Number of signers)'
          actual="$(echo "$certs" | grep -m1 -E 'certificate SHA-256 digest:' | sed -E 's/.*digest: //' | tr -d ': ' | tr 'a-f' 'A-F')"
          [ -n "$actual" ] || { echo "::error::apksigner printed no certificate digest"; exit 1; }
          expected="$(tr -d ': \n' < .github/android-release-cert.sha256 | tr 'a-f' 'A-F')"
          echo "APK certificate SHA-256: $actual"
          if [ -n "${RELEASE_KEYSTORE:-}" ]; then
            [ "$actual" = "$expected" ] || { echo "::error::APK certificate does not match .github/android-release-cert.sha256"; exit 1; }
            echo "SIGN_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "SIGN_SUFFIX=-debugkey" >> "$GITHUB_ENV"
          fi
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Scan bundled JS for secrets
        run: |
          set -euo pipefail
          unzip -q android/app/build/outputs/apk/release/app-release.apk 'assets/*' -d "$RUNNER_TEMP/apk"
          gitleaks dir --redact --verbose --exit-code 1 "$RUNNER_TEMP/apk/assets"
      - name: Name artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/kaitech-${APP_BUILD_NUMBER}-${SOURCE_SHA::7}${SIGN_SUFFIX}.apk"
          (cd dist && sha256sum ./*.apk | tee SHA256SUMS-android.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kaitech-android-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

  ios:
    name: ios ipa (unsigned)
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Toolchain
        run: |
          xcodebuild -version
          pod --version
      - name: Build number
        run: echo "APP_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - run: npx expo prebuild --platform ios
      - name: xcodebuild (no code signing)
        run: |
          mkdir -p build
          if ! xcodebuild \
            -workspace ios/Kaitech.xcworkspace \
            -scheme Kaitech \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1; then
            grep -E 'error:' build/xcodebuild.log | head -50 || true
            tail -100 build/xcodebuild.log
            exit 1
          fi
          grep -E '^\*\* BUILD' build/xcodebuild.log
      - name: Package IPA
        run: |
          set -euo pipefail
          app=build/ios/Build/Products/Release-iphoneos/Kaitech.app
          test -f "$app/main.jsbundle"
          mkdir -p ipa/Payload dist
          cp -R "$app" ipa/Payload/
          ipa_name="kaitech-${APP_BUILD_NUMBER}-${SOURCE_SHA::7}-unsigned.ipa"
          (cd ipa && zip -qry "../dist/$ipa_name" Payload)
          (cd dist && shasum -a 256 ./*.ipa | tee SHA256SUMS-ios.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kaitech-ios-ipa
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ios-build-log
          path: build/xcodebuild.log
          retention-days: 7

  ios-bundle-scan:
    name: ios bundle secret scan
    needs: ios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gitleaks
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kaitech-ios-ipa
          path: dist
      - run: |
          set -euo pipefail
          unzip -q dist/*.ipa 'Payload/Kaitech.app/main.jsbundle' -d "$RUNNER_TEMP/ipa"
          gitleaks dir --redact --verbose --exit-code 1 "$RUNNER_TEMP/ipa"

  ipad-simulator:
    name: ipad simulator (trial)
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-maestro
      - uses: ./.github/actions/setup-gitleaks
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: xcodebuild for the simulator (no code signing)
        run: |
          mkdir -p build
          if ! xcodebuild \
            -workspace ios/Kaitech.xcworkspace \
            -scheme Kaitech \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build > build/xcodebuild.log 2>&1; then
            grep -E 'error:' build/xcodebuild.log | head -50 || true
            tail -100 build/xcodebuild.log
            exit 1
          fi
          grep -E '^\*\* BUILD' build/xcodebuild.log
      - name: Run Maestro flows on an iPad simulator
        run: bash scripts/e2e-ipad.sh build/ios/Build/Products/Release-iphonesimulator/Kaitech.app e2e-output
      - name: Scan E2E output for secrets
        id: scan-e2e
        if: always()
        run: |
          if [ ! -d e2e-output ]; then
            echo "no E2E output"
            exit 0
          fi
          gitleaks dir --redact --verbose --exit-code 1 e2e-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-e2e.outcome == 'success'
        with:
          name: e2e-ipad
          path: e2e-output/
          if-no-files-found: warn
          retention-days: 30

  e2e-android-cell:
    name: e2e android ${{ matrix.size }} ${{ matrix.orientation }} ${{ matrix.locale }}
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        size: [phone, tablet]
        orientation: [portrait, landscape]
        locale: [en-US, id-ID]
        include:
          - size: phone
            profile: pixel_6
          - size: tablet
            profile: pixel_tablet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kaitech-android-apk
          path: dist
      - uses: ./.github/actions/setup-maestro
      - uses: ./.github/actions/setup-gitleaks
      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/e2e-android.sh dist e2e-output/${{ matrix.size }}-${{ matrix.orientation }}-${{ matrix.locale }} ${{ matrix.locale }} ${{ matrix.size }} ${{ matrix.orientation }}
      - name: Scan E2E output for secrets
        id: scan-e2e
        if: always()
        run: |
          if [ ! -d e2e-output ]; then
            echo "no E2E output"
            exit 0
          fi
          gitleaks dir --redact --verbose --exit-code 1 e2e-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-e2e.outcome == 'success'
        with:
          name: e2e-android-${{ matrix.size }}-${{ matrix.orientation }}-${{ matrix.locale }}
          path: e2e-output/
          if-no-files-found: warn
          retention-days: 30

  e2e-android:
    name: e2e android ${{ matrix.locale }}
    needs: e2e-android-cell
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        locale: [en-US, id-ID]
    steps:
      - name: Every phone and tablet cell passed
        env:
          CELLS: ${{ needs.e2e-android-cell.result }}
        run: |
          echo "e2e android cells: $CELLS"
          [ "$CELLS" = success ]

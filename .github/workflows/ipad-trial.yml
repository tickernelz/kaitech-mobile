name: iPad trial

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'modules/**'
      - 'plugins/**'
      - 'patches/**'
      - 'index.ts'
      - 'app.json'
      - 'app.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.maestro/**'
      - 'scripts/e2e-ipad.sh'
      - '.github/workflows/ipad-trial.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  KAITECH_LINK_HOST: ${{ vars.KAITECH_LINK_HOST }}
  KAITECH_DEFAULT_DB: ${{ vars.KAITECH_DEFAULT_DB }}

concurrency:
  group: ipad-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipad-simulator:
    name: ipad simulator en-US (trial)
    runs-on: xcode-27
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-maestro
      - uses: ./.github/actions/setup-gitleaks
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: xcodebuild for the simulator (no code signing)
        run: |
          mkdir -p build
          if ! xcodebuild \
            -workspace ios/Kaitech.xcworkspace \
            -scheme Kaitech \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build > build/xcodebuild.log 2>&1; then
            grep -E 'error:' build/xcodebuild.log | head -50 || true
            tail -100 build/xcodebuild.log
            exit 1
          fi
          grep -E '^\*\* BUILD' build/xcodebuild.log
      - name: Run Maestro flows on an iPad simulator
        run: bash scripts/e2e-ipad.sh build/ios/Build/Products/Release-iphonesimulator/Kaitech.app e2e-output en-US
      - name: Scan E2E output for secrets
        id: scan-e2e
        if: always()
        run: |
          if [ ! -d e2e-output ]; then
            echo "no E2E output"
            exit 0
          fi
          gitleaks dir --redact --verbose --exit-code 1 e2e-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-e2e.outcome == 'success'
        with:
          name: e2e-ipad-en-US
          path: e2e-output/
          if-no-files-found: warn
          retention-days: 30

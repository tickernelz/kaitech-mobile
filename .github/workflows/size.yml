name: Size

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event.action == 'labeled' && github.event.label.name != 'measure-ios' && format('size-ignored-{0}', github.run_id)
    || format('size-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_SHA: ${{ github.sha }}
  KAITECH_LINK_HOST: ${{ vars.KAITECH_LINK_HOST }}
  KAITECH_DEFAULT_DB: ${{ vars.KAITECH_DEFAULT_DB }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      measure: ${{ steps.plan.outputs.measure }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'measure-ios') }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          measure=false
          if [ "$EVENT" != pull_request ]; then
            measure=true
          elif [ "$ACTION" = labeled ]; then
            if [ "$LABEL" = measure-ios ]; then measure=true; fi
          elif [ "$HAS_LABEL" = true ]; then
            measure=true
          else
            native="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' \
              | grep -E '^(package(-lock)?\.json|app\.json|app\.config\.ts|fingerprint\.config\.js|assets/|plugins/|modules/|patches/|perf/|scripts/perf-gate\.mjs|\.github/actions/build-ios-ipa/|\.github/workflows/size\.yml)' || true)"
            if [ -n "$native" ]; then
              measure=true
              printf 'Native inputs changed:\n%s\n' "$native"
            fi
          fi
          echo "measure=$measure" | tee -a "$GITHUB_OUTPUT"

  ios:
    name: ios ipa size
    needs: plan
    if: needs.plan.outputs.measure == 'true' && github.repository == 'tickernelz/kaitech-mobile'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: ./.github/actions/build-ios-ipa

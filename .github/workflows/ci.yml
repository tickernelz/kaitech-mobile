name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-gitleaks
      - name: Scan full git history
        run: gitleaks git --redact --verbose --exit-code 1 .
      - name: Scan working tree
        run: gitleaks dir --redact --verbose --exit-code 1 .

  checks:
    name: lint, typecheck, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: i18n key parity (en = id)
        run: npm run i18n:check
      - name: Tablet config gate (rotation, iPad multitasking, Android multi-window)
        run: node scripts/check-tablet-config.mjs
      - run: npm test -- --ci
      - uses: ./.github/actions/setup-maestro
      - name: Maestro flow syntax
        run: find .maestro -name '*.yaml' ! -name config.yaml -print0 | xargs -0 -n1 maestro check-syntax

  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          if [ "$EVENT" = pull_request ]; then
            files="$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")"
            printf '%s\n' "$files"
            if [ -n "$files" ] && ! grep -qvE '^(docs/.+|README\.md)$' <<<"$files"; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  build:
    name: build
    needs: changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/build.yml
    with:
      docs_only: ${{ needs.changes.outputs.docs_only == 'true' }}
    secrets: inherit

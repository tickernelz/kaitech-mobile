name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')"
          other="$(grep -vE '^docs/|\.md$' <<< "$files" || true)"
          if [ -n "$other" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only pull request: lint, typecheck and unit report skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  gitleaks:
    name: gitleaks diff
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-gitleaks
      - name: Scan the commits this change adds
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$HEAD"
          else
            range="$HEAD^!"
          fi
          echo "gitleaks over $range ($(git rev-list --count "$range") commits)"
          gitleaks git --redact --verbose --exit-code 1 --log-opts="$range" .

  lint:
    name: lint
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Tablet config gate (rotation, iPad multitasking, Android multi-window)
        run: node scripts/check-tablet-config.mjs

  typecheck:
    name: typecheck
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - uses: ./.github/actions/setup-maestro
      - name: Maestro flow syntax
        run: |
          maestro --version > /dev/null
          find .maestro -name '*.yaml' ! -name config.yaml -print0 | xargs -0 -n1 -P "$(nproc)" maestro check-syntax

  unit:
    name: unit
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: i18n key parity (en = id)
        run: npm run i18n:check
      - run: npm test -- --ci

  cache-cleanup:
    name: cache cleanup
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete the caches of the closed pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          ids="$(gh cache list --ref "$REF" --limit 100 --json id --jq '.[].id')"
          for id in $ids; do
            gh cache delete "$id"
          done
          echo "Deleted $(wc -w <<< "$ids") caches of $REF." | tee -a "$GITHUB_STEP_SUMMARY"

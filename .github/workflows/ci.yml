name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-gitleaks
      - name: Scan full git history
        run: gitleaks git --redact --verbose --exit-code 1 .
      - name: Scan working tree
        run: gitleaks dir --redact --verbose --exit-code 1 .

  checks:
    name: lint, typecheck, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: i18n key parity (en = id)
        run: npm run i18n:check
      - run: npm test -- --ci
      - uses: ./.github/actions/setup-maestro
      - name: Maestro flow syntax
        run: find .maestro -name '*.yaml' ! -name config.yaml -print0 | xargs -0 -n1 maestro check-syntax

  build:
    name: build
    uses: ./.github/workflows/build.yml
    secrets: inherit

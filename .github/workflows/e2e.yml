name: E2E

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['docs/**', '**/*.md']
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: smoke runs one Android cell; android runs the Android matrix and the signed-in rows; full adds the iPhone simulator.
        type: choice
        options: [smoke, android, full]
        default: smoke

permissions:
  contents: read

concurrency:
  group: >-
    ${{ (github.event_name == 'schedule' || inputs.mode == 'full' || inputs.mode == 'android') && format('e2e-{0}-{1}', inputs.mode || 'full', github.run_id)
    || github.event.action == 'labeled' && github.event.label.name != 'run-e2e' && format('e2e-ignored-{0}', github.run_id)
    || format('e2e-{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SAVE_CACHES: ${{ github.ref == 'refs/heads/main' }}
  KAITECH_LINK_HOST: ${{ vars.KAITECH_LINK_HOST }}
  KAITECH_DEFAULT_DB: ${{ vars.KAITECH_DEFAULT_DB }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      cells: ${{ steps.mode.outputs.cells }}
      flows: ${{ steps.mode.outputs.flows }}
    steps:
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-e2e') }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push) mode=smoke ;;
            schedule) mode=full ;;
            workflow_dispatch) mode="$DISPATCH_MODE" ;;
            pull_request)
              if [ "$HAS_LABEL" = true ] && { [ "$ACTION" != labeled ] || [ "$LABEL" = run-e2e ]; }; then mode=smoke; else mode=none; fi
              ;;
            *) mode=none ;;
          esac
          if [ "$mode" = full ] || [ "$mode" = android ]; then
            cells='[{"size":"phone","orientations":"portrait landscape","locale":"en-US"},
              {"size":"phone","orientations":"portrait landscape","locale":"id-ID"},
              {"size":"tablet","orientations":"portrait landscape","locale":"en-US"},
              {"size":"tablet","orientations":"portrait landscape","locale":"id-ID"}]'
            flows=''
          else
            cells='[{"size":"phone","orientations":"portrait","locale":"en-US"}]'
            flows='.maestro/welcome.yaml .maestro/sign-in-form.yaml'
          fi
          echo "E2E mode: $mode"
          {
            echo "mode=$mode"
            echo "cells=$(jq -c --arg mode "$mode" 'map({mode: $mode} + .)' <<< "$cells")"
            echo "flows=$flows"
          } >> "$GITHUB_OUTPUT"

  android-apk:
    name: android apk x86_64
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: ./.github/actions/build-android-apk
        with:
          abis: x86_64
          variant: x86_64
          artifact: e2e-apk-x86_64
          native-cache: 'true'
          save-cache: ${{ env.SAVE_CACHES }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  android:
    name: android
    needs: [plan, android-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-apk-x86_64
          path: dist
      - uses: ./.github/actions/android-e2e
        with:
          apk-dir: dist
          artifact: e2e-android-${{ needs.plan.outputs.mode }}-${{ matrix.size }}-${{ matrix.locale }}
          size: ${{ matrix.size }}
          locale: ${{ matrix.locale }}
          orientations: ${{ matrix.orientations }}
          flows: ${{ needs.plan.outputs.flows }}
          runner: ${{ vars.E2E_RUNNER || 'auto' }}
          cold-start: ${{ matrix.size == 'phone' && matrix.locale == 'en-US' && '5' || '0' }}

  android-rows:
    name: android rows
    needs: [plan, android-apk]
    if: needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: kaitech-e2e-account-${{ matrix.size }}-${{ matrix.locale }}
      cancel-in-progress: false
      queue: max
    env:
      E2E_LOGIN: ${{ secrets.KAITECH_E2E_LOGIN }}
      E2E_PASSWORD: ${{ secrets.KAITECH_E2E_PASSWORD }}
      E2E_WEB_LOGIN: ${{ secrets.KAITECH_E2E_WEB_LOGIN }}
      E2E_WEB_PASSWORD: ${{ secrets.KAITECH_E2E_WEB_PASSWORD }}
      E2E_SERVER: ${{ vars.KAITECH_LINK_HOST }}
      E2E_DB: ${{ vars.KAITECH_DEFAULT_DB }}
      E2E_CHANNEL_ID: ${{ vars.KAITECH_E2E_CHANNEL_ID }}
      E2E_PEER: ${{ vars.KAITECH_E2E_PEER }}
      E2E_PROGRAMME: ${{ vars.KAITECH_E2E_PROGRAMME }}
      E2E_SEARCH: ${{ vars.KAITECH_E2E_SEARCH }}
      E2E_HIDE_DIRECT: ${{ matrix.variant == 'hide-direct' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { size: phone, locale: en-US, variant: hide-direct }
          - { size: phone, locale: id-ID }
          - { size: tablet, locale: en-US }
          - { size: tablet, locale: id-ID }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-apk-x86_64
          path: dist
      - uses: ./.github/actions/android-e2e
        with:
          apk-dir: dist
          artifact: e2e-android-rows-${{ matrix.size }}-${{ matrix.locale }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          output-prefix: rows-
          size: ${{ matrix.size }}
          locale: ${{ matrix.locale }}
          orientations: portrait
          flows: .maestro/signed-in/rows-chat.yaml .maestro/signed-in/rows-discovery.yaml .maestro/signed-in/rows-mom.yaml
          runner: ${{ vars.E2E_RUNNER_ROWS || 'maestro' }}
          audio: 'true'

  android-mom:
    name: android mom
    needs: [plan, android-apk, android-rows]
    if: always() && (needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'android') && needs.android-apk.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: kaitech-e2e-account-${{ matrix.size }}-${{ matrix.locale }}
      cancel-in-progress: false
      queue: max
    env:
      E2E_LOGIN: ${{ secrets.KAITECH_E2E_LOGIN }}
      E2E_PASSWORD: ${{ secrets.KAITECH_E2E_PASSWORD }}
      E2E_WEB_LOGIN: ${{ secrets.KAITECH_E2E_WEB_LOGIN }}
      E2E_WEB_PASSWORD: ${{ secrets.KAITECH_E2E_WEB_PASSWORD }}
      E2E_SERVER: ${{ vars.KAITECH_LINK_HOST }}
      E2E_DB: ${{ vars.KAITECH_DEFAULT_DB }}
      E2E_CHANNEL_ID: ${{ vars.KAITECH_E2E_CHANNEL_ID }}
      E2E_PEER: ${{ vars.KAITECH_E2E_PEER }}
      E2E_PROGRAMME: ${{ vars.KAITECH_E2E_PROGRAMME }}
      E2E_SEARCH: ${{ vars.KAITECH_E2E_SEARCH }}
      E2E_MINUTES_NAME: Kickoff Payroll
      E2E_FOLLOWUP_OWNER: '183'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { size: phone, locale: en-US }
          - { size: phone, locale: id-ID }
          - { size: tablet, locale: en-US }
          - { size: tablet, locale: id-ID }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-apk-x86_64
          path: dist
      - uses: ./.github/actions/android-e2e
        with:
          apk-dir: dist
          artifact: e2e-android-mom-${{ matrix.size }}-${{ matrix.locale }}
          output-prefix: mom-
          size: ${{ matrix.size }}
          locale: ${{ matrix.locale }}
          orientations: portrait
          flows: .maestro/signed-in/mom-more.yaml .maestro/signed-in/mom-followups.yaml .maestro/signed-in/mom-final.yaml .maestro/signed-in/mom-minutes.yaml .maestro/signed-in/mom-editor.yaml .maestro/signed-in/mom-workspace.yaml
          runner: ${{ vars.E2E_RUNNER_ROWS || 'maestro' }}
          audio: 'true'

  ios:
    name: ios simulator en-US
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: macos-26
    timeout-minutes: 75
    concurrency:
      group: kaitech-e2e-ios
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          xcodebuild -version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-maestro
      - uses: ./.github/actions/setup-gitleaks
      - run: npm ci
      - name: Native fingerprint
        id: fingerprint
        run: |
          set -euo pipefail
          hash="$(npx @expo/fingerprint fingerprint:generate --platform ios | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).hash))')"
          echo "Native fingerprint (ios): $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Restore the simulator build with this fingerprint
        id: app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native-app
          key: ios-simulator-app-arm64-${{ steps.fingerprint.outputs.hash }}
      - if: steps.app.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform ios --no-install
      - name: Restore the Xcode compilation cache
        id: cas
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cas
          key: ios-cas-${{ steps.fingerprint.outputs.hash }}
          restore-keys: ios-cas-
      - if: steps.app.outputs.cache-hit != 'true'
        working-directory: ios
        run: pod install
      - name: xcodebuild for the simulator (no code signing)
        id: xcodebuild
        if: steps.app.outputs.cache-hit != 'true'
        run: |
          mkdir -p build
          if [ -d build/cas ] && [ "$(du -sm build/cas | cut -f1)" -gt 3072 ]; then
            echo "compilation cache over 3072 MB, starting empty"
            rm -rf build/cas
          fi
          if ! xcodebuild \
            -workspace ios/Kaitech.xcworkspace \
            -scheme Kaitech \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$PWD/build/cas" \
            CODE_SIGNING_ALLOWED=NO \
            build > build/xcodebuild.log 2>&1; then
            grep -E 'error:' build/xcodebuild.log | head -50 || true
            tail -100 build/xcodebuild.log
            exit 1
          fi
          grep -E '^\*\* BUILD' build/xcodebuild.log
          cas_mb="$(du -sm build/cas | cut -f1)"
          echo "compilation cache: $cas_mb MB"
          if [ "$cas_mb" -le 3072 ]; then
            echo "cas-fits=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::compilation cache is $cas_mb MB, over 3072 MB: not saved"
          fi
          mkdir -p build/native-app
          cp -R build/ios/Build/Products/Release-iphonesimulator/Kaitech.app build/native-app/
      - if: steps.app.outputs.cache-hit != 'true' && env.SAVE_CACHES == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native-app
          key: ios-simulator-app-arm64-${{ steps.fingerprint.outputs.hash }}
      - if: steps.app.outputs.cache-hit != 'true' && steps.cas.outputs.cache-hit != 'true' && steps.xcodebuild.outputs.cas-fits == 'true' && env.SAVE_CACHES == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cas
          key: ios-cas-${{ steps.fingerprint.outputs.hash }}
      - name: Repack the cached simulator build with this commit's JS bundle
        if: steps.app.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R build/native-app/Kaitech.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry ../native.ipa Payload)
          rm -rf build/native-app/Kaitech.app
          npx repack-app --platform ios --js-bundle-only \
            --source-app "$RUNNER_TEMP/native.ipa" \
            --working-directory "$RUNNER_TEMP/repack" \
            --output build/native-app/Kaitech.app
      - name: Cache summary
        if: always()
        env:
          APP_OUTCOME: ${{ steps.app.outcome }}
          APP_HIT: ${{ steps.app.outputs.cache-hit }}
          APP_KEY: ${{ steps.app.outputs.cache-primary-key }}
          CAS_OUTCOME: ${{ steps.cas.outcome }}
          CAS_HIT: ${{ steps.cas.outputs.cache-hit }}
          CAS_KEY: ${{ steps.cas.outputs.cache-primary-key }}
          CAS_MATCHED: ${{ steps.cas.outputs.cache-matched-key }}
        run: |
          bash scripts/cache-summary.sh "$SAVE_CACHES" \
            ios-simulator-app "$APP_OUTCOME" "$APP_HIT" "$APP_KEY" "" \
            ios-cas "$CAS_OUTCOME" "$CAS_HIT" "$CAS_KEY" "$CAS_MATCHED"
      - name: Run Maestro flows on an iPhone simulator
        run: bash scripts/e2e-ios.sh build/native-app/Kaitech.app e2e-output en-US
      - name: Scan E2E output for secrets
        id: scan-e2e
        if: always()
        run: |
          if [ ! -d e2e-output ]; then
            echo "no E2E output"
            exit 0
          fi
          gitleaks dir --redact --verbose --exit-code 1 e2e-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-e2e.outcome == 'success'
        with:
          name: e2e-ios-en-US
          path: e2e-output/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ios-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

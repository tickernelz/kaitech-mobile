name: E2E

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['docs/**', '**/*.md']
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: smoke runs one Android cell; full runs the Android matrix, the signed-in rows and the iPad simulator.
        type: choice
        options: [smoke, full]
        default: smoke

permissions:
  contents: read

concurrency:
  group: >-
    ${{ (github.event_name == 'schedule' || inputs.mode == 'full') && 'kaitech-e2e-account'
    || github.event.action == 'labeled' && github.event.label.name != 'run-e2e' && format('e2e-ignored-{0}', github.run_id)
    || format('e2e-{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  KAITECH_LINK_HOST: ${{ vars.KAITECH_LINK_HOST }}
  KAITECH_DEFAULT_DB: ${{ vars.KAITECH_DEFAULT_DB }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      cells: ${{ steps.mode.outputs.cells }}
    steps:
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-e2e') }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push) mode=smoke ;;
            schedule) mode=full ;;
            workflow_dispatch) mode="$DISPATCH_MODE" ;;
            pull_request)
              if [ "$HAS_LABEL" = true ] && { [ "$ACTION" != labeled ] || [ "$LABEL" = run-e2e ]; }; then mode=smoke; else mode=none; fi
              ;;
            *) mode=none ;;
          esac
          if [ "$mode" = full ]; then
            cells='[{"size":"phone","profile":"pixel_6","locale":"en-US","orientations":"portrait landscape","cold_start":5},
              {"size":"phone","profile":"pixel_6","locale":"id-ID","orientations":"portrait landscape","cold_start":0},
              {"size":"tablet","profile":"pixel_tablet","locale":"en-US","orientations":"portrait landscape","cold_start":0},
              {"size":"tablet","profile":"pixel_tablet","locale":"id-ID","orientations":"portrait landscape","cold_start":0}]'
          else
            cells='[{"size":"phone","profile":"pixel_6","locale":"en-US","orientations":"portrait","cold_start":5,"flows":".maestro/welcome.yaml .maestro/sign-in-form.yaml"}]'
          fi
          echo "E2E mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "cells=$(jq -c . <<< "$cells")" >> "$GITHUB_OUTPUT"

  android-apk:
    name: android apk x86_64
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: ./.github/actions/build-android-apk
        with:
          abis: x86_64
          variant: x86_64
          artifact: e2e-apk-x86_64
          native-cache: 'true'
          save-cache: ${{ github.event_name != 'pull_request' }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  android:
    name: android ${{ needs.plan.outputs.mode }} ${{ matrix.size }} ${{ matrix.orientations }} ${{ matrix.locale }}
    needs: [plan, android-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-apk-x86_64
          path: dist
      - uses: ./.github/actions/android-e2e
        with:
          apk-dir: dist
          artifact: e2e-android-${{ needs.plan.outputs.mode }}-${{ matrix.size }}-${{ matrix.locale }}
          size: ${{ matrix.size }}
          profile: ${{ matrix.profile }}
          locale: ${{ matrix.locale }}
          orientations: ${{ matrix.orientations }}
          flows: ${{ matrix.flows }}
          runner: ${{ vars.E2E_RUNNER || 'auto' }}
          cold-start: ${{ matrix.cold_start }}
          save-snapshot: ${{ github.event_name != 'pull_request' }}

  android-rows:
    name: android rows ${{ matrix.size }} ${{ matrix.locale }}${{ matrix.hide_direct == 'true' && ' hide-direct' || '' }}
    needs: [plan, android-apk]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_LOGIN: ${{ secrets.KAITECH_E2E_LOGIN }}
      E2E_PASSWORD: ${{ secrets.KAITECH_E2E_PASSWORD }}
      E2E_WEB_LOGIN: ${{ secrets.KAITECH_E2E_WEB_LOGIN }}
      E2E_WEB_PASSWORD: ${{ secrets.KAITECH_E2E_WEB_PASSWORD }}
      E2E_SERVER: ${{ vars.KAITECH_LINK_HOST }}
      E2E_DB: ${{ vars.KAITECH_DEFAULT_DB }}
      E2E_CHANNEL_ID: ${{ vars.KAITECH_E2E_CHANNEL_ID }}
      E2E_PEER: ${{ vars.KAITECH_E2E_PEER }}
      E2E_PROGRAMME: ${{ vars.KAITECH_E2E_PROGRAMME }}
      E2E_SEARCH: ${{ vars.KAITECH_E2E_SEARCH }}
      E2E_HIDE_DIRECT: ${{ matrix.hide_direct || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        size: [phone, tablet]
        locale: [en-US, id-ID]
        include:
          - size: phone
            profile: pixel_6
          - size: tablet
            profile: pixel_tablet
          - size: phone
            locale: en-US
            hide_direct: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-apk-x86_64
          path: dist
      - uses: ./.github/actions/android-e2e
        with:
          apk-dir: dist
          artifact: e2e-android-rows-${{ matrix.size }}-${{ matrix.locale }}${{ matrix.hide_direct == 'true' && '-hide-direct' || '' }}
          output-prefix: rows-
          size: ${{ matrix.size }}
          profile: ${{ matrix.profile }}
          locale: ${{ matrix.locale }}
          orientations: portrait
          flows: .maestro/signed-in/rows-chat.yaml .maestro/signed-in/rows-discovery.yaml .maestro/signed-in/rows-mom.yaml
          runner: ${{ vars.E2E_RUNNER_ROWS || 'maestro' }}
          audio: 'true'
          snapshot: 'false'

  android-chat:
    name: android chat ${{ matrix.size }} ${{ matrix.orientations }} ${{ matrix.locale }}
    needs: [plan, android-apk, android-rows]
    if: always() && needs.plan.outputs.mode == 'full' && needs.android-apk.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_LOGIN: ${{ secrets.KAITECH_E2E_LOGIN }}
      E2E_PASSWORD: ${{ secrets.KAITECH_E2E_PASSWORD }}
      E2E_WEB_LOGIN: ${{ secrets.KAITECH_E2E_WEB_LOGIN }}
      E2E_WEB_PASSWORD: ${{ secrets.KAITECH_E2E_WEB_PASSWORD }}
      E2E_SERVER: ${{ vars.KAITECH_LINK_HOST }}
      E2E_DB: ${{ vars.KAITECH_DEFAULT_DB }}
      E2E_CHANNEL_ID: ${{ vars.KAITECH_E2E_CHANNEL_ID }}
      E2E_PEER: ${{ vars.KAITECH_E2E_PEER }}
      E2E_PROGRAMME: ${{ vars.KAITECH_E2E_PROGRAMME }}
      E2E_SEARCH: ${{ vars.KAITECH_E2E_SEARCH }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {size: phone, profile: pixel_6, locale: en-US, orientations: portrait}
          - {size: phone, profile: pixel_6, locale: id-ID, orientations: portrait}
          - {size: tablet, profile: pixel_tablet, locale: en-US, orientations: landscape}
          - {size: tablet, profile: pixel_tablet, locale: id-ID, orientations: landscape}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-apk-x86_64
          path: dist
      - uses: ./.github/actions/android-e2e
        with:
          apk-dir: dist
          artifact: e2e-android-chat-${{ matrix.size }}-${{ matrix.locale }}
          output-prefix: chat-
          size: ${{ matrix.size }}
          profile: ${{ matrix.profile }}
          locale: ${{ matrix.locale }}
          orientations: ${{ matrix.orientations }}
          flows: .maestro/signed-in/message-actions.yaml .maestro/signed-in/thread-actions.yaml .maestro/signed-in/composer-extras.yaml .maestro/signed-in/new-conversation.yaml
          runner: maestro
          snapshot: 'false'

  ipad:
    name: ipad simulator en-US
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          xcodebuild -version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-maestro
      - uses: ./.github/actions/setup-gitleaks
      - run: npm ci
      - name: Native fingerprint
        id: fingerprint
        run: |
          set -euo pipefail
          hash="$(npx @expo/fingerprint fingerprint:generate --platform ios | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).hash))')"
          echo "Native fingerprint (ios): $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Restore the simulator build with this fingerprint
        id: app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native-app
          key: ios-simulator-app-${{ steps.fingerprint.outputs.hash }}
      - if: steps.app.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform ios --no-install
      - name: Restore Pods with this fingerprint
        id: pods
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ios/Pods
            ios/Podfile.lock
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/ReactNative
          key: ios-pods-${{ steps.fingerprint.outputs.hash }}
          restore-keys: ios-pods-
      - if: steps.app.outputs.cache-hit != 'true'
        working-directory: ios
        run: pod install
      - if: steps.app.outputs.cache-hit != 'true' && steps.pods.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ios/Pods
            ios/Podfile.lock
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/ReactNative
          key: ios-pods-${{ steps.fingerprint.outputs.hash }}
      - name: xcodebuild for the simulator (no code signing)
        if: steps.app.outputs.cache-hit != 'true'
        run: |
          mkdir -p build
          if ! xcodebuild \
            -workspace ios/Kaitech.xcworkspace \
            -scheme Kaitech \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build > build/xcodebuild.log 2>&1; then
            grep -E 'error:' build/xcodebuild.log | head -50 || true
            tail -100 build/xcodebuild.log
            exit 1
          fi
          grep -E '^\*\* BUILD' build/xcodebuild.log
          mkdir -p build/native-app
          cp -R build/ios/Build/Products/Release-iphonesimulator/Kaitech.app build/native-app/
      - if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native-app
          key: ios-simulator-app-${{ steps.fingerprint.outputs.hash }}
      - name: Repack the cached simulator build with this commit's JS bundle
        if: steps.app.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R build/native-app/Kaitech.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry ../native.ipa Payload)
          rm -rf build/native-app/Kaitech.app
          npx repack-app --platform ios --js-bundle-only \
            --source-app "$RUNNER_TEMP/native.ipa" \
            --working-directory "$RUNNER_TEMP/repack" \
            --output build/native-app/Kaitech.app
      - name: Run Maestro flows on an iPad simulator
        run: bash scripts/e2e-ipad.sh build/native-app/Kaitech.app e2e-output en-US
      - name: Scan E2E output for secrets
        id: scan-e2e
        if: always()
        run: |
          if [ ! -d e2e-output ]; then
            echo "no E2E output"
            exit 0
          fi
          gitleaks dir --redact --verbose --exit-code 1 e2e-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-e2e.outcome == 'success'
        with:
          name: e2e-ipad-en-US
          path: e2e-output/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ipad-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

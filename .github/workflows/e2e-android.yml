name: E2E Android

on:
  workflow_call:
    inputs:
      label:
        type: string
        default: ''
      apk-artifact:
        type: string
        required: true
      flows:
        type: string
        default: ''
      matrix:
        type: string
        required: true
      audio:
        type: boolean
        default: false
      call-peer:
        type: boolean
        default: false
      max-parallel:
        type: number
        default: 16

permissions:
  contents: read

jobs:
  cell:
    name: ${{ matrix.size }} ${{ matrix.orientation }} ${{ matrix.locale }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_FLOWS: ${{ inputs.flows }}
      E2E_LOGIN: ${{ secrets.KAITECH_E2E_LOGIN }}
      E2E_PASSWORD: ${{ secrets.KAITECH_E2E_PASSWORD }}
      E2E_WEB_LOGIN: ${{ secrets.KAITECH_E2E_WEB_LOGIN }}
      E2E_WEB_PASSWORD: ${{ secrets.KAITECH_E2E_WEB_PASSWORD }}
      E2E_SERVER: ${{ vars.KAITECH_LINK_HOST }}
      E2E_DB: ${{ vars.KAITECH_DEFAULT_DB }}
      E2E_CHANNEL_ID: ${{ vars.KAITECH_E2E_CHANNEL_ID }}
      E2E_PEER: ${{ vars.KAITECH_E2E_PEER }}
      E2E_PROGRAMME: ${{ vars.KAITECH_E2E_PROGRAMME }}
      E2E_SEARCH: ${{ vars.KAITECH_E2E_SEARCH }}
      E2E_HIDE_DIRECT: ${{ matrix.hide_direct || 'false' }}
      E2E_CALL_PEER: ${{ inputs.call-peer && '1' || '' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.apk-artifact }}
          path: dist
      - uses: ./.github/actions/setup-maestro
      - uses: ./.github/actions/setup-gitleaks
      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          COLD_START_RUNS: ${{ matrix.cold_start || 0 }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect ${{ !inputs.audio && '-noaudio' || '' }} -no-boot-anim -camera-back none -camera-front ${{ inputs.call-peer && 'emulated' || 'none' }}
          script: bash scripts/e2e-android.sh dist e2e-output/${{ inputs.label }}${{ matrix.size }}-${{ matrix.orientation }}-${{ matrix.locale }} ${{ matrix.locale }} ${{ matrix.size }} ${{ matrix.orientation }}
      - name: Scan E2E output for secrets
        id: scan-e2e
        if: always()
        run: |
          if [ ! -d e2e-output ]; then
            echo "no E2E output"
            exit 0
          fi
          gitleaks dir --redact --verbose --exit-code 1 e2e-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-e2e.outcome == 'success'
        with:
          name: e2e-android-${{ inputs.label }}${{ matrix.size }}-${{ matrix.orientation }}-${{ matrix.locale }}
          path: e2e-output/
          if-no-files-found: warn
          retention-days: 30

name: Set up maestro-runner
description: Installs a pinned, checksum-verified maestro-runner on PATH with telemetry and the update check off and their host unreachable.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MAESTRO_RUNNER_VERSION: 1.1.31
        MAESTRO_RUNNER_SHA256: a5c19b6eeea0b520a82d58a77a2d6355e4373871bdf7c2489decdbdb2dd08b0e
      run: |
        set -euo pipefail
        archive="maestro-runner-${MAESTRO_RUNNER_VERSION}-linux-amd64.tar.gz"
        curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/devicelab-dev/maestro-runner/releases/download/v${MAESTRO_RUNNER_VERSION}/$archive"
        echo "${MAESTRO_RUNNER_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/maestro-runner/bin" >> "$GITHUB_PATH"
        {
          echo "MAESTRO_RUNNER_NO_TELEMETRY=1"
          echo "DO_NOT_TRACK=1"
          echo "MAESTRO_RUNNER_NO_UPDATE_CHECK=1"
          echo "MAESTRO_RUNNER_TELEMETRY_DEBUG=1"
        } >> "$GITHUB_ENV"
        echo '0.0.0.0 open.devicelab.dev' | sudo tee -a /etc/hosts > /dev/null

name: Set up gitleaks
description: Installs a pinned, checksum-verified gitleaks binary on PATH (Linux x64 or macOS arm64).
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256_LINUX_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        GITLEAKS_SHA256_DARWIN_ARM64: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
      run: |
        set -euo pipefail
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) platform=linux_x64 sha256="$GITLEAKS_SHA256_LINUX_X64" ;;
          macOS-ARM64) platform=darwin_arm64 sha256="$GITLEAKS_SHA256_DARWIN_ARM64" ;;
          *) echo "::error::no pinned gitleaks for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        dest="$RUNNER_TEMP/gitleaks"
        mkdir -p "$dest"
        curl -sSfL -o "$dest/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${platform}.tar.gz"
        echo "${sha256}  $dest/gitleaks.tgz" | shasum -a 256 -c -
        tar -xzf "$dest/gitleaks.tgz" -C "$dest" gitleaks
        echo "$dest" >> "$GITHUB_PATH"

name: Build iOS IPA
description: Builds the unsigned Release IPA for iphoneos, uploads it, and runs the IPA and JS bundle size gate. Expects a checkout of SOURCE_SHA with full history and setup-node on a macOS runner.
runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      run: |
        sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
        xcodebuild -version
        pod --version
    - shell: bash
      run: npm ci
    - name: Build number
      shell: bash
      run: echo "APP_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
    - shell: bash
      run: npx expo prebuild --platform ios
    - name: xcodebuild (no code signing)
      shell: bash
      run: |
        mkdir -p build
        if ! xcodebuild \
          -workspace ios/Kaitech.xcworkspace \
          -scheme Kaitech \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -derivedDataPath build/ios \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build > build/xcodebuild.log 2>&1; then
          scripts/expo-module-scan.sh build/xcodebuild.log || true
          grep -E 'error:' build/xcodebuild.log | head -50 || true
          tail -100 build/xcodebuild.log
          exit 1
        fi
        scripts/expo-module-scan.sh build/xcodebuild.log
        grep -E '^\*\* BUILD' build/xcodebuild.log
    - name: Package IPA
      shell: bash
      run: |
        set -euo pipefail
        app=build/ios/Build/Products/Release-iphoneos/Kaitech.app
        test -f "$app/main.jsbundle"
        mkdir -p ipa/Payload dist
        cp -R "$app" ipa/Payload/
        ipa_name="kaitech-${APP_BUILD_NUMBER}-${SOURCE_SHA::7}-unsigned.ipa"
        (cd ipa && zip -qry "../dist/$ipa_name" Payload)
        (cd dist && shasum -a 256 ./*.ipa | tee SHA256SUMS-ios.txt)
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: kaitech-ios-ipa
        path: dist/
        if-no-files-found: error
        retention-days: 30
    - name: Performance gate (IPA and JS bundle size)
      id: perf
      shell: bash
      run: |
        set -euo pipefail
        ipa="$(find dist -maxdepth 1 -name '*.ipa' | head -1)"
        node scripts/perf-gate.mjs --out perf-output/ios.json \
          "ios.ipa_bytes=$(wc -c < "$ipa" | tr -d ' ')" \
          "ios.js_bundle_bytes=$(wc -c < build/ios/Build/Products/Release-iphoneos/Kaitech.app/main.jsbundle | tr -d ' ')"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && steps.perf.outcome != 'skipped'
      with:
        name: perf-ios
        path: perf-output/
        if-no-files-found: warn
        retention-days: 90
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: ios-ipa-build-log
        path: build/xcodebuild.log
        retention-days: 7

appId: io.kaitech.mobile
name: New conversation sheet opens an existing chat
tags:
  - signed-in
  - chat-actions
onFlowStart:
  - runFlow: ../shared/orientation.yaml
---
- launchApp
- extendedWaitUntil:
    visible:
      id: (welcome-sign-in|tab-chat)
    timeout: 30000
- runFlow:
    when:
      visible:
        id: welcome-sign-in
    commands:
      - runFlow: ../shared/sign-in.yaml
- tapOn:
    id: tab-button-chat
- extendedWaitUntil:
    visible:
      id: chat-new
    timeout: 30000
- tapOn:
    id: chat-new
- extendedWaitUntil:
    visible:
      id: new-sheet
    timeout: 10000
- tapOn:
    id: new-search
- inputText: ${PEER_SEARCH}
- tapOn:
    id: new-search-.*
    index: 0
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: d1-new
- tapOn:
    id: new-create
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: ${PEER}
    timeout: 10000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: d2-opened

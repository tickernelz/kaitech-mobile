appId: io.kaitech.mobile
name: Send eight messages while the screen is recorded for frame comparison
tags:
  - signed-in
  - motion
---
- tapOn:
    id: composer-input
- repeat:
    times: 8
    commands:
      - inputText: ${RUN + ' motion'}
      - tapOn:
          id: composer-send
      - extendedWaitUntil:
          notVisible:
            id: (pending-queued|pending-sending)
          timeout: 30000
      - waitForAnimationToEnd
- runFlow: ../shared/dismiss-keyboard.yaml
- waitForAnimationToEnd

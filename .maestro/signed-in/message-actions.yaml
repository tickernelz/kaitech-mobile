appId: io.kaitech.mobile
name: Message actions from the long-press sheet, checked on the server
tags:
  - signed-in
  - chat-actions
onFlowStart:
  - runFlow: ../shared/orientation.yaml
onFlowComplete:
  - runScript:
      file: ../scripts/web-peer.js
      env:
        ACTION: tidy
---
- launchApp
- extendedWaitUntil:
    visible:
      id: (welcome-sign-in|tab-chat)
    timeout: 30000
- runFlow:
    when:
      visible:
        id: welcome-sign-in
    commands:
      - runFlow: ../shared/sign-in.yaml
- tapOn:
    id: tab-button-chat
- runScript:
    file: ../scripts/web-peer.js
    env:
      ACTION: group
      GROUP: ${'Uji teruskan ' + RUN}
- extendedWaitUntil:
    visible:
      text: ${PEER}
    timeout: 60000
- tapOn:
    text: ${PEER}
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 30000
- tapOn:
    id: composer-input
- inputText: ${RUN + ' a1'}
- tapOn:
    id: composer-send
- runFlow: ../shared/dismiss-keyboard.yaml
- extendedWaitUntil:
    notVisible:
      id: (pending-queued|pending-sending)
    timeout: 30000
- longPressOn:
    text: ${RUN + ' a1'}
- extendedWaitUntil:
    visible:
      id: message-actions
    timeout: 10000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: a1-sheet
- tapOn:
    id: action-more
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: a2-more
- scrollUntilVisible:
    element:
      id: action-pin
    direction: DOWN
- tapOn:
    id: action-pin
- extendedWaitUntil:
    visible:
      text: .*(Pinned|Disematkan).*
    timeout: 20000
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: message-actions
          commands:
            - back
      - scrollUntilVisible:
          element:
            text: ${RUN + ' a1'}
          direction: UP
          timeout: 10000
          optional: true
      - longPressOn:
          text: ${RUN + ' a1'}
      - tapOn:
          id: action-more
- scrollUntilVisible:
    element:
      id: action-star
    direction: DOWN
- tapOn:
    id: action-star
- extendedWaitUntil:
    visible:
      text: .*(Starred|Berbintang).*
    timeout: 20000
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: message-actions
          commands:
            - back
      - scrollUntilVisible:
          element:
            text: ${RUN + ' a1'}
          direction: UP
          timeout: 10000
          optional: true
      - longPressOn:
          text: ${RUN + ' a1'}
      - tapOn:
          id: action-emoji
- extendedWaitUntil:
    visible:
      id: emoji-picker
    timeout: 10000
- tapOn:
    id: emoji-search
- inputText: rocket
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: a3-emoji
- tapOn:
    id: emoji-cell-0
- extendedWaitUntil:
    visible:
      text: "\U0001F680 1"
    timeout: 15000
- runScript:
    file: ../scripts/web-peer.js
    env:
      ACTION: read
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: message-actions
          commands:
            - back
      - scrollUntilVisible:
          element:
            text: ${RUN + ' a1'}
          direction: UP
          timeout: 10000
          optional: true
      - longPressOn:
          text: ${RUN + ' a1'}
      - tapOn:
          id: action-more
- scrollUntilVisible:
    element:
      id: action-reactions
    direction: DOWN
- tapOn:
    id: action-reactions
- extendedWaitUntil:
    visible:
      id: reactions-sheet
    timeout: 10000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: a3b-reactions
- tapOn:
    id: reactions-sheet-close
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: message-actions
          commands:
            - back
      - scrollUntilVisible:
          element:
            text: ${RUN + ' a1'}
          direction: UP
          timeout: 10000
          optional: true
      - longPressOn:
          text: ${RUN + ' a1'}
      - tapOn:
          id: action-edit
- extendedWaitUntil:
    visible:
      id: composer-editing
    timeout: 10000
- tapOn:
    id: composer-input
- eraseText: 60
- inputText: ${RUN + ' a1 edited'}
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: a4-editing
- tapOn:
    id: composer-save-edit
- runFlow: ../shared/dismiss-keyboard.yaml
- extendedWaitUntil:
    notVisible:
      id: composer-editing
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: ${RUN + ' a1 edited.*'}
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: edited-.*
    timeout: 15000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: a5-edited
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: message-actions
          commands:
            - back
      - scrollUntilVisible:
          element:
            text: ${RUN + ' a1 edited.*'}
          direction: UP
          timeout: 10000
          optional: true
      - longPressOn:
          text: ${RUN + ' a1 edited.*'}
      - tapOn:
          id: action-forward
- extendedWaitUntil:
    visible:
      id: forward-sheet
    timeout: 15000
- tapOn:
    id: forward-search
- inputText: ${'Uji teruskan ' + RUN}
- tapOn:
    id: forward-target-.*
    index: 0
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: a6-forward
- tapOn:
    id: forward-send
- extendedWaitUntil:
    visible:
      id: thread-notice
    timeout: 4000
    optional: true
- runFlow:
    when:
      true: ${MAKE_TASK == 'yes'}
    commands:
      - retry:
          maxRetries: 2
          commands:
            - runFlow:
                when:
                  visible:
                    id: message-actions
                commands:
                  - back
            - longPressOn:
                text: ${RUN + ' a1 edited.*'}
            - tapOn:
                id: action-more
      - scrollUntilVisible:
          element:
            id: action-task
          direction: DOWN
      - tapOn:
          id: action-task
      - extendedWaitUntil:
          visible:
            id: task-create
          timeout: 15000
      - runFlow:
          file: ../shared/screenshot.yaml
          env:
            SCREEN: a7-task
      - tapOn:
          id: task-create
      - extendedWaitUntil:
          visible:
            id: thread-notice
          timeout: 4000
          optional: true
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: message-actions
          commands:
            - back
      - scrollUntilVisible:
          element:
            text: ${RUN + ' a1 edited.*'}
          direction: UP
          timeout: 10000
          optional: true
      - longPressOn:
          text: ${RUN + ' a1 edited.*'}
      - tapOn:
          id: action-more
- scrollUntilVisible:
    element:
      id: action-activity
    direction: DOWN
- tapOn:
    id: action-activity
- extendedWaitUntil:
    visible:
      id: activity-create
    timeout: 15000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: a8-activity
- tapOn:
    id: activity-create
- extendedWaitUntil:
    visible:
      id: thread-notice
    timeout: 4000
    optional: true
- runFlow:
    when:
      true: ${MEETING == 'yes'}
    commands:
      - retry:
          maxRetries: 2
          commands:
            - runFlow:
                when:
                  visible:
                    id: message-actions
                commands:
                  - back
            - longPressOn:
                text: ${RUN + ' a1 edited.*'}
            - tapOn:
                id: action-more
      - scrollUntilVisible:
          element:
            id: action-meeting
          direction: DOWN
      - tapOn:
          id: action-meeting
      - extendedWaitUntil:
          visible:
            id: meeting-schedule
          timeout: 15000
      - tapOn:
          id: meeting-start-day-1
      - tapOn:
          id: meeting-start-time-480
      - runFlow:
          file: ../shared/screenshot.yaml
          env:
            SCREEN: a9-meeting
      - tapOn:
          id: meeting-schedule
      - extendedWaitUntil:
          visible:
            id: thread-notice
          timeout: 4000
          optional: true
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: message-actions
          commands:
            - back
      - scrollUntilVisible:
          element:
            text: ${RUN + ' a1 edited.*'}
          direction: UP
          timeout: 10000
          optional: true
      - longPressOn:
          text: ${RUN + ' a1 edited.*'}
      - tapOn:
          id: action-more
- scrollUntilVisible:
    element:
      id: action-link
    direction: DOWN
- tapOn:
    id: action-link
- extendedWaitUntil:
    visible:
      id: thread-notice
    timeout: 4000
    optional: true
- tapOn:
    id: composer-input
- inputText: ${RUN + ' a2'}
- tapOn:
    id: composer-send
- runFlow: ../shared/dismiss-keyboard.yaml
- extendedWaitUntil:
    notVisible:
      id: (pending-queued|pending-sending)
    timeout: 30000
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: message-actions
          commands:
            - back
      - longPressOn:
          text: ${RUN + ' a2'}
      - tapOn:
          id: action-delete
- tapOn:
    text: (DELETE|Delete|HAPUS|Hapus)
- extendedWaitUntil:
    visible:
      text: (This message was deleted|Pesan ini sudah dihapus)
    timeout: 15000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: a10-deleted
- runScript:
    file: ../scripts/actions-peer.js
- assertTrue: ${output.actions.edited == 1 && output.actions.removed == 1 && output.actions.pinned == 1 && output.actions.reacted == 1 && output.actions.forwarded == 1 && output.actions.activity == 1}
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: message-actions
          commands:
            - back
      - scrollUntilVisible:
          element:
            text: ${RUN + ' a1 edited.*'}
          direction: UP
          timeout: 10000
          optional: true
      - longPressOn:
          text: ${RUN + ' a1 edited.*'}
      - tapOn:
          id: action-more
- scrollUntilVisible:
    element:
      id: action-unread
    direction: DOWN
- tapOn:
    id: action-unread
- extendedWaitUntil:
    visible:
      id: (chat-list|thread-notice)
    timeout: 15000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: a12-unread
- runFlow:
    when:
      visible:
        id: thread-back
      notVisible:
        id: chat-list
    commands:
      - tapOn:
          id: thread-back
- extendedWaitUntil:
    visible:
      id: chat-starred-open
    timeout: 30000
- tapOn:
    id: chat-starred-open
- extendedWaitUntil:
    visible:
      id: found-.*
    timeout: 20000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: a14-starred
- tapOn:
    id: found-.*
    index: 0
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 30000
- runFlow:
    when:
      visible:
        id: chat-list
    commands:
      - tapOn:
          text: ${PEER}
      - extendedWaitUntil:
          visible:
            id: composer-input
          timeout: 30000
- setAirplaneMode: enabled
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: message-actions
          commands:
            - back
      - scrollUntilVisible:
          element:
            text: ${RUN + ' a1 edited.*'}
          direction: UP
          timeout: 10000
          optional: true
      - longPressOn:
          text: ${RUN + ' a1 edited.*'}
      - tapOn:
          id: action-more
- scrollUntilVisible:
    element:
      id: action-star
    direction: DOWN
- tapOn:
    id: action-star
- extendedWaitUntil:
    visible:
      text: (Can't reach the server.*|Server tidak bisa dihubungi.*)
    timeout: 20000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: a13-offline
- setAirplaneMode: disabled

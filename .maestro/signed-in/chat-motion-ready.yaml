appId: io.kaitech.mobile
name: Open the test chat for the motion recording
tags:
  - signed-in
  - motion
---
- launchApp
- extendedWaitUntil:
    visible:
      id: (welcome-sign-in|tab-chat)
    timeout: 30000
- runFlow:
    when:
      visible:
        id: welcome-sign-in
    commands:
      - runFlow: ../shared/sign-in.yaml
- runFlow: ../shared/no-ring.yaml
- tapOn:
    id: tab-button-chat
- extendedWaitUntil:
    visible:
      text: ${PEER}
    timeout: 60000
- tapOn:
    text: ${PEER}
- extendedWaitUntil:
    visible:
      id: thread-list
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 30000
- waitForAnimationToEnd

appId: io.kaitech.mobile
name: Thread actions behind the header More button
tags:
  - signed-in
  - chat-actions
onFlowStart:
  - runFlow: ../shared/orientation.yaml
---
- launchApp
- extendedWaitUntil:
    visible:
      id: (welcome-sign-in|tab-chat)
    timeout: 30000
- runFlow:
    when:
      visible:
        id: welcome-sign-in
    commands:
      - runFlow: ../shared/sign-in.yaml
- tapOn:
    id: tab-button-chat
- extendedWaitUntil:
    visible:
      id: chat-list
    timeout: 30000
- runScript:
    file: ../scripts/web-peer.js
    env:
      ACTION: group
      GROUP: ${'Uji thread ' + RUN}
- evalScript: ${output.row = 'conversation-' + output.peer.group}
- scrollUntilVisible:
    element:
      id: chat-filter-all
    direction: UP
- swipe:
    from:
      id: chat-filter-all
    direction: DOWN
- scrollUntilVisible:
    element:
      id: ${output.row}
    timeout: 60000
- retry:
    maxRetries: 2
    commands:
      - scrollUntilVisible:
          element:
            id: ${output.row}
          timeout: 30000
      - tapOn:
          id: ${output.row}
- extendedWaitUntil:
    visible:
      id: thread-more
    timeout: 30000
- tapOn:
    id: thread-more
- extendedWaitUntil:
    visible:
      id: thread-actions
    timeout: 10000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: b1-thread-actions
- scrollUntilVisible:
    element:
      id: thread-action-search
    direction: DOWN
- tapOn:
    id: thread-action-search
- tapOn:
    id: search-input
- inputText: halo
- extendedWaitUntil:
    visible:
      id: found-.*
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible:
        id: found-.*
    commands:
      - eraseText: 40
      - inputText: halo
- extendedWaitUntil:
    visible:
      id: found-.*
    timeout: 20000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: b2-search
- tapOn:
    id: found-.*
    index: 0
- tapOn:
    id: thread-more
- scrollUntilVisible:
    element:
      id: thread-action-pinned
    direction: DOWN
- tapOn:
    id: thread-action-pinned
- extendedWaitUntil:
    visible:
      id: pinned-sheet
    timeout: 15000
- tapOn:
    id: pinned-sheet-close
- tapOn:
    id: thread-more
- scrollUntilVisible:
    element:
      id: thread-action-files
    direction: DOWN
- tapOn:
    id: thread-action-files
- extendedWaitUntil:
    visible:
      id: files-sheet
    timeout: 15000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: b3-files
- tapOn:
    id: files-sheet-close
- tapOn:
    id: thread-more
- scrollUntilVisible:
    element:
      id: thread-action-members
    direction: DOWN
- tapOn:
    id: thread-action-members
- extendedWaitUntil:
    visible:
      id: members-sheet
    timeout: 15000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: b4-members
- tapOn:
    id: members-sheet-close
- tapOn:
    id: thread-more
- scrollUntilVisible:
    element:
      id: thread-action-scheduled
    direction: DOWN
- tapOn:
    id: thread-action-scheduled
- extendedWaitUntil:
    visible:
      id: scheduled-sheet
    timeout: 15000
- tapOn:
    id: scheduled-sheet-close
- tapOn:
    id: thread-more
- scrollUntilVisible:
    element:
      id: thread-action-meeting
    direction: DOWN
    optional: true
- runFlow:
    when:
      visible:
        id: thread-action-meeting
    commands:
      - tapOn:
          id: thread-action-meeting
      - extendedWaitUntil:
          visible:
            id: meeting-sheet
          timeout: 15000
      - runFlow:
          file: ../shared/screenshot.yaml
          env:
            SCREEN: b9-meeting
      - tapOn:
          id: meeting-sheet-close
- runFlow:
    when:
      visible:
        id: thread-actions
    commands:
      - back
- tapOn:
    id: thread-more
- scrollUntilVisible:
    element:
      id: thread-action-pin
    direction: DOWN
- tapOn:
    id: thread-action-pin
- extendedWaitUntil:
    visible:
      id: thread-notice
    timeout: 15000
- tapOn:
    id: thread-more
- scrollUntilVisible:
    element:
      id: thread-action-pin
    direction: DOWN
- tapOn:
    id: thread-action-pin
- extendedWaitUntil:
    visible:
      id: thread-notice
    timeout: 15000
- tapOn:
    id: thread-more
- scrollUntilVisible:
    element:
      id: thread-action-notify
    direction: DOWN
- tapOn:
    id: thread-action-notify
- extendedWaitUntil:
    visible:
      id: notify-sheet
    timeout: 10000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: b5-notify
- tapOn:
    id: notify-level-mentions
- tapOn:
    id: thread-more
- scrollUntilVisible:
    element:
      id: thread-action-read
    direction: DOWN
- tapOn:
    id: thread-action-read
- tapOn:
    id: thread-more
- scrollUntilVisible:
    element:
      id: thread-action-rename
    direction: DOWN
- tapOn:
    id: thread-action-rename
- extendedWaitUntil:
    visible:
      id: rename-sheet
    timeout: 10000
- tapOn:
    id: rename-description
- inputText: ${'Info ' + RUN}
- runFlow: ../shared/dismiss-keyboard.yaml
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: b6-info
- tapOn:
    id: rename-save
- extendedWaitUntil:
    visible:
      id: thread-notice
    timeout: 15000
- tapOn:
    id: thread-more
- scrollUntilVisible:
    element:
      id: thread-action-members
    direction: DOWN
- tapOn:
    id: thread-action-members
- extendedWaitUntil:
    visible:
      id: members-invite
    timeout: 15000
- tapOn:
    id: members-invite
- extendedWaitUntil:
    visible:
      id: invite-sheet
    timeout: 10000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: b7-invite
- tapOn:
    id: invite-sheet-close
- runFlow:
    when:
      visible:
        id: members-sheet-close
    commands:
      - tapOn:
          id: members-sheet-close
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: message-actions
          commands:
            - back
      - longPressOn:
          text: ${'Uji thread ' + RUN + ' halo'}
      - tapOn:
          id: action-more
- scrollUntilVisible:
    element:
      id: action-thread
    direction: DOWN
- tapOn:
    id: action-thread
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 30000
- tapOn:
    id: composer-input
- inputText: ${RUN + ' sub'}
- tapOn:
    id: composer-send
- extendedWaitUntil:
    visible:
      text: ${RUN + ' sub'}
    timeout: 20000
- runFlow:
    when:
      visible:
        id: thread-back
    commands:
      - tapOn:
          id: thread-back
- runFlow:
    when:
      visible:
        id: chat-list
    commands:
      - scrollUntilVisible:
          element:
            id: ${output.row}
          timeout: 30000
      - tapOn:
          id: ${output.row}
- extendedWaitUntil:
    visible:
      id: thread-more
    timeout: 15000
- tapOn:
    id: thread-more
- scrollUntilVisible:
    element:
      id: thread-action-threads
    direction: DOWN
- tapOn:
    id: thread-action-threads
- extendedWaitUntil:
    visible:
      id: sub-.*
    timeout: 15000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: b8-threads
- tapOn:
    id: sub-.*
    index: 0
- extendedWaitUntil:
    visible:
      text: ${RUN + ' sub'}
    timeout: 20000
- tapOn:
    id: thread-more
- scrollUntilVisible:
    element:
      id: thread-action-delete
    direction: DOWN
- tapOn:
    id: thread-action-delete
- tapOn:
    text: (?i)(delete thread|hapus thread)
- runFlow:
    when:
      visible:
        id: chat-list
    commands:
      - tapOn:
          id: ${output.row}
- extendedWaitUntil:
    visible:
      text: ${'Uji thread ' + RUN + ' halo'}
    timeout: 20000
- tapOn:
    id: thread-more
- scrollUntilVisible:
    element:
      id: thread-action-leave
    direction: DOWN
- tapOn:
    id: thread-action-leave
- tapOn:
    text: (?i)(leave|keluar)
- extendedWaitUntil:
    visible:
      id: chat-list
    timeout: 20000
- runScript:
    file: ../scripts/web-peer.js
    env:
      ACTION: left
      TARGET: ${String(output.peer.group)}

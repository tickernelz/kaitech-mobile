appId: io.kaitech.mobile
name: Voice call from a chat with the web peer, in-call controls, hang up
tags:
  - signed-in
  - call
onFlowStart:
  - runFlow: ../shared/orientation.yaml
---
- launchApp
- extendedWaitUntil:
    visible:
      id: (welcome-sign-in|tab-chat)
    timeout: 30000
- runFlow:
    when:
      visible:
        id: welcome-sign-in
    commands:
      - runFlow: ../shared/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: (incoming-call|tab-button-chat)
    timeout: 30000
- runFlow:
    when:
      visible:
        id: incoming-call
    commands:
      - assertVisible:
          id: incoming-answer-other
      - tapOn:
          id: incoming-answer
- runFlow:
    when:
      notVisible:
        id: call-screen
    commands:
      - tapOn:
          id: tab-button-chat
      - extendedWaitUntil:
          visible:
            id: chat-list
          timeout: 30000
      - tapOn:
          text: ${PEER}
      - extendedWaitUntil:
          visible:
            id: call-voice
          timeout: 30000
      - tapOn:
          id: call-voice
- extendedWaitUntil:
    visible:
      id: call-screen
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: call-controls
    timeout: 60000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: k1-live
- tapOn:
    id: call-mute
- runFlow:
    when:
      visible:
        id: call-speaker
    commands:
      - tapOn:
          id: call-speaker
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: k2-muted
- tapOn:
    id: call-more
- extendedWaitUntil:
    visible:
      id: call-sheet-hand
    timeout: 10000
- assertVisible:
    id: call-sheet-deafen
- assertVisible:
    id: call-sheet-output
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: k3-more
- tapOn:
    id: call-sheet-hand
- tapOn:
    id: call-more
- tapOn:
    id: call-sheet-deafen
- tapOn:
    id: call-more
- tapOn:
    id: call-sheet-people
- extendedWaitUntil:
    visible:
      id: call-sheet-people
    timeout: 10000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: k4-people
- tapOn:
    id: call-sheet-backdrop
- tapOn:
    id: call-hangup
- extendedWaitUntil:
    notVisible:
      id: call-screen
    timeout: 30000

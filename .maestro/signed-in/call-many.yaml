appId: io.kaitech.mobile
name: Calls with two web peers - a group rings the phone into a call that already holds both peers, a channel is joined from its call notice; three people, a peer camera and a peer screen
tags:
  - signed-in
  - call
onFlowStart:
  - runFlow: ../shared/orientation.yaml
---
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: (welcome-sign-in|tab-chat)
    timeout: 30000
- runFlow:
    when:
      visible:
        id: welcome-sign-in
    commands:
      - runFlow: ../shared/sign-in.yaml
- tapOn:
    id: tab-button-chat
- extendedWaitUntil:
    visible:
      text: ${GROUP_NAME}
    timeout: 30000
- runScript:
    file: ../scripts/call-peer-command.js
    env:
      PEER_PORT: ${GROUP_PEER_1}
      PEER_ACTION: join
      CAMERA: '-'
      SHARE: '-'
- extendedWaitUntil:
    visible:
      id: incoming-call
    timeout: 30000
- runScript:
    file: ../scripts/call-peer-command.js
    env:
      PEER_PORT: ${GROUP_PEER_2}
      PEER_ACTION: join
      CAMERA: '-'
      SHARE: '-'
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: m1-group-ring
- tapOn:
    id: incoming-answer
- extendedWaitUntil:
    visible:
      id: call-grid
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: call-tile-PA_.*
      index: 2
    timeout: 30000
- assertNotVisible:
    id: call-tile-PA_.*
    index: 3
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: m2-group-grid
- tapOn:
    id: call-more
- scrollUntilVisible:
    element:
      id: call-sheet-people
    direction: DOWN
- tapOn:
    id: call-sheet-people
- extendedWaitUntil:
    visible:
      id: call-sheet-people
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: call-person-PA_.*
      index: 2
    timeout: 30000
- assertNotVisible:
    id: call-person-PA_.*
    index: 3
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: m3-group-people
- tapOn:
    id: call-sheet-backdrop
- runScript:
    file: ../scripts/call-peer-command.js
    env:
      PEER_PORT: ${GROUP_PEER_1}
      PEER_ACTION: command
      CAMERA: 'on'
      SHARE: '-'
- extendedWaitUntil:
    visible:
      id: call-tile-video
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: m4-group-peer-camera
- runScript:
    file: ../scripts/call-peer-command.js
    env:
      PEER_PORT: ${GROUP_PEER_2}
      PEER_ACTION: command
      CAMERA: '-'
      SHARE: 'on'
- extendedWaitUntil:
    visible:
      id: call-screen-share
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: .*'s screen
    timeout: 15000
- assertVisible:
    id: call-screen-share-people
- extendedWaitUntil:
    visible:
      id: e2e-pause
    timeout: 3000
    optional: true
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: m5-group-peer-screen
- repeat:
    times: 6
    commands:
      - runScript:
          file: ../scripts/call-peer-command.js
          env:
            PEER_PORT: ${GROUP_PEER_2}
            PEER_ACTION: command
            CAMERA: '-'
            SHARE: 'off'
      - extendedWaitUntil:
          notVisible:
            id: call-screen-share
          timeout: 30000
      - runScript:
          file: ../scripts/call-peer-command.js
          env:
            PEER_PORT: ${GROUP_PEER_2}
            PEER_ACTION: command
            CAMERA: '-'
            SHARE: 'on'
      - extendedWaitUntil:
          visible:
            id: call-screen-share
          timeout: 30000
      - extendedWaitUntil:
          visible:
            text: .*'s screen
          timeout: 15000
- extendedWaitUntil:
    visible:
      id: e2e-pause
    timeout: 3000
    optional: true
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: m5-group-peer-screen-again
- runScript:
    file: ../scripts/call-peer-command.js
    env:
      PEER_PORT: ${GROUP_PEER_2}
      PEER_ACTION: command
      CAMERA: '-'
      SHARE: 'off'
- runScript:
    file: ../scripts/call-peer-command.js
    env:
      PEER_PORT: ${GROUP_PEER_1}
      PEER_ACTION: command
      CAMERA: 'off'
      SHARE: '-'
- extendedWaitUntil:
    visible:
      id: call-hangup
    timeout: 30000
- assertNotVisible:
    id: call-screen-share
- tapOn:
    id: call-hangup
- extendedWaitUntil:
    notVisible:
      id: call-screen
    timeout: 30000
- runScript:
    file: ../scripts/call-peer-command.js
    env:
      PEER_PORT: ${GROUP_PEER_1}
      PEER_ACTION: leave
      CAMERA: '-'
      SHARE: '-'
- runScript:
    file: ../scripts/call-peer-command.js
    env:
      PEER_PORT: ${GROUP_PEER_2}
      PEER_ACTION: leave
      CAMERA: '-'
      SHARE: '-'
- runScript:
    file: ../scripts/call-peer-command.js
    env:
      PEER_PORT: ${CHANNEL_PEER_1}
      PEER_ACTION: join
      CAMERA: '-'
      SHARE: '-'
- runScript:
    file: ../scripts/call-peer-command.js
    env:
      PEER_PORT: ${CHANNEL_PEER_2}
      PEER_ACTION: join
      CAMERA: '-'
      SHARE: '-'
- tapOn:
    id: tab-button-chat
- scrollUntilVisible:
    element:
      text: ${CHANNEL_NAME}
    direction: UP
    timeout: 30000
    centerElement: true
- tapOn:
    text: ${CHANNEL_NAME}
- extendedWaitUntil:
    visible:
      id: call-notice-.*-join
    timeout: 30000
- assertNotVisible:
    id: call-notice-.*-join
    index: 1
- assertNotVisible:
    id: incoming-call
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: m6-channel-notice
- tapOn:
    id: call-notice-.*-join
- extendedWaitUntil:
    visible:
      id: call-controls
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: call-tile-PA_.*
      index: 2
    timeout: 30000
- assertNotVisible:
    id: call-tile-PA_.*
    index: 3
- tapOn:
    id: call-more
- scrollUntilVisible:
    element:
      id: call-sheet-people
    direction: DOWN
- tapOn:
    id: call-sheet-people
- extendedWaitUntil:
    visible:
      id: call-sheet-people
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: call-person-PA_.*
      index: 2
    timeout: 30000
- assertNotVisible:
    id: call-person-PA_.*
    index: 3
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: m7-channel-people
- tapOn:
    id: call-sheet-backdrop
- tapOn:
    id: call-hangup
- extendedWaitUntil:
    notVisible:
      id: call-screen
    timeout: 30000
- runScript:
    file: ../scripts/call-peer-command.js
    env:
      PEER_PORT: ${CHANNEL_PEER_1}
      PEER_ACTION: leave
      CAMERA: '-'
      SHARE: '-'
- runScript:
    file: ../scripts/call-peer-command.js
    env:
      PEER_PORT: ${CHANNEL_PEER_2}
      PEER_ACTION: leave
      CAMERA: '-'
      SHARE: '-'

appId: io.kaitech.mobile
name: MoM More - lists, processing status, recording menu, and removing the test recording this flow uploaded under its own run name
tags:
  - signed-in
onFlowStart:
  - runFlow: ../shared/orientation.yaml
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: welcome-sign-in
    timeout: 30000
- runFlow: ../shared/sign-in.yaml
- runFlow: ../shared/pick-test-programme.yaml
- tapOn:
    id: tab-button-mom
- extendedWaitUntil:
    visible:
      id: mom-record
    timeout: 60000
- tapOn:
    id: mom-record
- extendedWaitUntil:
    visible:
      id: setup-name
    timeout: 30000
- scrollUntilVisible:
    element:
      id: setup-consent
- tapOn:
    id: setup-consent
- scrollUntilVisible:
    element:
      id: setup-lark
- tapOn:
    id: setup-lark
- tapOn:
    id: setup-lark-url
- inputText: https://example.com/not-lark
- runFlow: ../shared/dismiss-keyboard.yaml
- tapOn:
    id: setup-lark-send
- extendedWaitUntil:
    visible:
      id: setup-problem
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: m0-lark-refused
- tapOn:
    id: header-back
- tapOn:
    id: mom-record
- extendedWaitUntil:
    visible:
      id: setup-name
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: m0-setup
- tapOn:
    id: setup-name
- inputText: ${'E2E More ' + RUN}
- runFlow: ../shared/dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      id: setup-consent
- tapOn:
    id: setup-consent
- runFlow: ../shared/start-recording.yaml
- extendedWaitUntil:
    visible:
      id: recorder-stop
    timeout: 30000
- tapOn:
    id: recorder-stop
- tapOn:
    text: (?i)(finish|selesai)
    index: -1
- extendedWaitUntil:
    visible:
      id: upload-done
    timeout: 180000
- runFlow:
    when:
      visible:
        id: mom-status
    commands:
      - tapOn:
          id: mom-status
      - extendedWaitUntil:
          visible:
            id: mom-status-sheet
          timeout: 10000
      - runFlow:
          file: ../shared/screenshot.yaml
          env:
            SCREEN: m6-status
      - back
- tapOn:
    id: mom-menu
- extendedWaitUntil:
    visible:
      id: mom-more-sheet
    timeout: 10000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: m5-more
- tapOn:
    id: mom-more-recordings
- extendedWaitUntil:
    visible:
      id: mom-record-[0-9]+
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: m7-all-recordings
- tapOn:
    id: header-back
- repeat:
    while:
      visible:
        id: upload-dismiss
    times: 5
    commands:
      - tapOn:
          id: upload-dismiss
- scrollUntilVisible:
    element:
      text: ${'E2E More ' + RUN}
- tapOn:
    text: ${'E2E More ' + RUN}
- extendedWaitUntil:
    visible:
      id: meeting-more
    timeout: 30000
- tapOn:
    id: meeting-more
- extendedWaitUntil:
    visible:
      id: meeting-more-sheet
    timeout: 10000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: m8-meeting-more
- tapOn:
    id: mom-more-history-[0-9]+
- extendedWaitUntil:
    visible:
      id: recording-history
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: m10-history
- tapOn:
    id: header-back
- tapOn:
    id: meeting-more
- tapOn:
    id: mom-more-departments-[0-9]+
- extendedWaitUntil:
    visible:
      id: recording-departments
    timeout: 30000
- runFlow:
    when:
      visible:
        id: recording-department-[1-9][0-9]*
    commands:
      - tapOn:
          id: recording-department-[1-9][0-9]*
          index: 0
      - extendedWaitUntil:
          visible:
            id: recording-department-0
          timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: m11-departments
- tapOn:
    id: header-back
- tapOn:
    id: meeting-more
- tapOn:
    id: mom-more-remove-[0-9]+
- extendedWaitUntil:
    visible:
      id: mom-remove-name
    timeout: 30000
- copyTextFrom:
    id: mom-remove-name
- tapOn:
    id: mom-remove-title
- inputText: ${maestro.copiedText}
- runFlow:
    when:
      true: ${DEVICE_SIZE === 'phone' && APP_LANGUAGE === 'en'}
    commands:
      - tapOn:
          id: mom-remove-password
      - inputText: not-the-password
      - runFlow: ../shared/dismiss-keyboard.yaml
      - tapOn:
          id: mom-remove-confirm
      - extendedWaitUntil:
          visible:
            id: mom-remove-problem
          timeout: 30000
      - runFlow:
          file: ../shared/screenshot.yaml
          env:
            SCREEN: m9-remove-refused
- tapOn:
    id: mom-remove-password
- inputText: ${PASSWORD}
- runFlow: ../shared/dismiss-keyboard.yaml
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: m9-remove
- runFlow: ../shared/confirm-removal.yaml
- tapOn:
    id: meeting-more
- extendedWaitUntil:
    visible:
      id: meeting-more-sheet
    timeout: 10000
- assertNotVisible:
    id: mom-more-remove-[0-9]+
- back

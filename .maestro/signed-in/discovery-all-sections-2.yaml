appId: io.kaitech.mobile
name: Web Discovery menus part 2 of 3 open their list and first record without an error
tags:
  - signed-in
onFlowStart:
  - runFlow: ../shared/orientation.yaml
---
- launchApp
- extendedWaitUntil:
    visible:
      id: (welcome-sign-in|tab-chat|tab-discovery)
    timeout: 30000
- runFlow:
    when:
      visible:
        id: welcome-sign-in
    commands:
      - runFlow: ../shared/sign-in.yaml
- tapOn:
    id: tab-button-discovery
- extendedWaitUntil:
    visible:
      id: programme-summary
    timeout: 60000
- runFlow:
    when:
      true: ${typeof PROGRAMME !== 'undefined' && PROGRAMME !== ''}
    commands:
      - tapOn:
          id: programme-switch
      - scrollUntilVisible:
          element:
            id: programme-${PROGRAMME}
      - tapOn:
          id: programme-${PROGRAMME}
      - extendedWaitUntil:
          visible:
            id: programme-summary
          timeout: 60000
- scrollUntilVisible:
    element:
      id: open-sections
- tapOn:
    id: open-sections
- extendedWaitUntil:
    visible:
      id: sections-group-[0-9]+
    timeout: 30000
- runFlow:
    file: ../shared/open-section-by-id.yaml
    label: "Meetings"
    env:
      MENU: 425
      NAME: "Meetings"
      NAME_ID: "Rapat"

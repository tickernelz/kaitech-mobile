appId: io.kaitech.mobile
name: Adaptive composer, emoji, sticker and GIF panel, and attach sheet extras
tags:
  - signed-in
  - chat-actions
onFlowStart:
  - runFlow: ../shared/orientation.yaml
---
- launchApp
- extendedWaitUntil:
    visible:
      id: (welcome-sign-in|tab-chat)
    timeout: 30000
- runFlow:
    when:
      visible:
        id: welcome-sign-in
    commands:
      - runFlow: ../shared/sign-in.yaml
- tapOn:
    id: tab-button-chat
- extendedWaitUntil:
    visible:
      text: ${PEER}
    timeout: 60000
- tapOn:
    text: ${PEER}
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 30000
- tapOn:
    id: composer-attach
- extendedWaitUntil:
    visible:
      id: extra-canned
    timeout: 10000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: c1-attach-sheet
- pressKey: back
- extendedWaitUntil:
    notVisible:
      id: extra-canned
    timeout: 10000
- assertVisible:
    id: composer-mic
- assertVisible:
    id: composer-camera
- tapOn:
    id: composer-input
- inputText: ${RUN + ' c0'}
- assertVisible:
    id: composer-send
- assertNotVisible:
    id: composer-camera
- eraseText: 40
- extendedWaitUntil:
    visible:
      id: composer-mic
    timeout: 5000
- assertVisible:
    id: composer-camera
- tapOn:
    id: composer-panel-toggle
- extendedWaitUntil:
    visible:
      id: composer-panel
    timeout: 10000
- tapOn:
    id: panel-tab-emoji
- extendedWaitUntil:
    visible:
      id: emoji-search
    timeout: 10000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: c1-panel-emoji
- tapOn:
    id: emoji-search
- inputText: rocket
- tapOn:
    id: emoji-cell-0
- tapOn:
    id: composer-input
- extendedWaitUntil:
    notVisible:
      id: composer-panel
    timeout: 10000
- inputText: ${' ' + RUN + ' c1'}
- tapOn:
    id: composer-send
- extendedWaitUntil:
    visible:
      text: ${'.*' + RUN + ' c1'}
    timeout: 20000
- runFlow:
    file: ../shared/dismiss-keyboard.yaml
- tapOn:
    id: composer-panel-toggle
- tapOn:
    id: panel-tab-gif
- extendedWaitUntil:
    visible:
      id: gif-cell-0
    timeout: 20000
- assertVisible:
    id: gif-search
    text: .*KLIPY.*
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: c1-panel-gif
- tapOn:
    id: gif-cell-0
- extendedWaitUntil:
    visible:
      id: rich-\d+
    timeout: 30000
- tapOn:
    id: panel-tab-sticker
- tapOn:
    id: sticker-source-provider
- extendedWaitUntil:
    visible:
      id: sticker-cell-0
    timeout: 20000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: c1-panel-sticker
- tapOn:
    id: sticker-cell-0
- extendedWaitUntil:
    notVisible:
      id: (pending-queued|pending-sending|pending-failed)
    timeout: 30000
- runFlow:
    when:
      visible:
        id: composer-panel
    commands:
      - pressKey: back
- extendedWaitUntil:
    notVisible:
      id: composer-panel
    timeout: 10000
- tapOn:
    id: composer-input
- inputText: ${RUN + ' c2 later'}
- hideKeyboard
- tapOn:
    id: composer-attach
- extendedWaitUntil:
    visible:
      id: extra-canned
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible:
        id: extra-canned
    commands:
      - tapOn:
          id: composer-attach
- scrollUntilVisible:
    element:
      id: extra-later
    direction: DOWN
- tapOn:
    id: extra-later
- extendedWaitUntil:
    visible:
      id: later-sheet
    timeout: 10000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: c2-later
- tapOn:
    id: later-tomorrow
- extendedWaitUntil:
    visible:
      id: thread-notice
    timeout: 4000
    optional: true
- tapOn:
    id: thread-more
- scrollUntilVisible:
    element:
      id: thread-action-scheduled
    direction: DOWN
- tapOn:
    id: thread-action-scheduled
- extendedWaitUntil:
    visible:
      text: ${'.*' + RUN + ' c2 later'}
    timeout: 20000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: c3-scheduled
- tapOn:
    text: ${'.*' + RUN + ' c2 later'}
- tapOn:
    id: scheduled-delete
- extendedWaitUntil:
    notVisible:
      text: ${'.*' + RUN + ' c2 later'}
    timeout: 20000
- tapOn:
    id: scheduled-sheet-close
- extendedWaitUntil:
    visible:
      id: thread-notice
    timeout: 4000
    optional: true
- runFlow:
    when:
      true: ${URGENT != 'no'}
    commands:
      - tapOn:
          id: composer-attach
      - scrollUntilVisible:
          element:
            id: extra-urgent
          direction: DOWN
      - runFlow:
          when:
            visible:
              id: extra-urgent
              enabled: false
          commands:
            - runFlow:
                file: ../shared/screenshot.yaml
                env:
                  SCREEN: c3-urgent-none
            - pressKey: back
            - extendedWaitUntil:
                notVisible:
                  id: extra-urgent
                timeout: 10000
      - runFlow:
          when:
            visible:
              id: extra-urgent
              enabled: true
          commands:
            - tapOn:
                id: extra-urgent
            - extendedWaitUntil:
                visible:
                  id: composer-urgent
                timeout: 10000
            - tapOn:
                id: composer-input
            - inputText: ${RUN + ' c3 urgent'}
            - tapOn:
                id: composer-send
            - extendedWaitUntil:
                visible:
                  text: ${'.*' + RUN + ' c3 urgent'}
                timeout: 20000
            - extendedWaitUntil:
                notVisible:
                  id: (pending-queued|pending-sending|pending-failed)
                timeout: 30000
- tapOn:
    id: composer-input
- inputText: '::'
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: c4-canned
- eraseText: 2

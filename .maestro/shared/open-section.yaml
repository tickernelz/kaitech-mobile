appId: io.kaitech.mobile
name: Find a Discovery section by its web menu name (SECTION in English, SECTION_ID as the server translates it), open its list and its first record
---
- runFlow:
    when:
      visible:
        id: sections-search-clear
    commands:
      - tapOn:
          id: sections-search-clear
- tapOn:
    id: sections-search
- inputText: "${APP_LANGUAGE === 'id' ? SECTION_ID : SECTION}"
- pressKey: Enter
- tapOn:
    text: "${APP_LANGUAGE === 'id' ? SECTION_ID : SECTION}"
    index: -1
- extendedWaitUntil:
    visible:
      id: (list-row-[0-9]+|list-rows-empty|list-group|list-groups-empty)
    timeout: 30000
- runFlow:
    when:
      visible:
        id: list-group
    commands:
      - tapOn:
          id: list-group
          index: 0
      - extendedWaitUntil:
          visible:
            id: (list-row-[0-9]+|list-rows-empty)
          timeout: 30000
- runFlow:
    file: screenshot.yaml
    env:
      SCREEN: ${SHOT}-list
- runFlow:
    when:
      visible:
        id: list-row-[0-9]+
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          id: list-row-[0-9]+
          index: 0
      - extendedWaitUntil:
          visible:
            id: record-screen
          timeout: 30000
      - extendedWaitUntil:
          notVisible:
            id: record-loading
          timeout: 30000
      - runFlow:
          file: screenshot.yaml
          env:
            SCREEN: ${SHOT}-record
      - runFlow:
          when:
            visible:
              id: record-more
          commands:
            - tapOn:
                id: record-more
            - extendedWaitUntil:
                visible:
                  id: record-more-sheet
                timeout: 5000
            - runFlow:
                file: screenshot.yaml
                env:
                  SCREEN: ${SHOT}-more
            - back
      - tapOn:
          id: header-back
- tapOn:
    id: header-back
- extendedWaitUntil:
    visible:
      id: sections-screen
    timeout: 10000

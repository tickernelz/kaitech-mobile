appId: io.kaitech.mobile
name: Press Start on the recording setup and answer the first-use permission prompts; press Start once more when the emulator recorder failed to start (one press is enough on a device, .maestro/local/mom-first-record.yaml)
---
- scrollUntilVisible:
    element:
      id: setup-start
- tapOn:
    id: setup-start
- repeat:
    times: 4
    commands:
      - extendedWaitUntil:
          visible:
            id: (recorder-time|com.android.permissioncontroller:id/.*)
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible:
              text: (While using the app|Saat aplikasi digunakan)
          commands:
            - tapOn:
                text: (While using the app|Saat aplikasi digunakan)
      - runFlow:
          when:
            visible:
              text: (Allow|Izinkan)
          commands:
            - tapOn:
                text: (Allow|Izinkan)
- runFlow:
    when:
      visible:
        id: setup-outcome
    commands:
      - tapOn:
          id: setup-start
- extendedWaitUntil:
    visible:
      id: recorder-time
    timeout: 30000

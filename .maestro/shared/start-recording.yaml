appId: io.kaitech.mobile
name: Press Start once on the recording setup, continue past the app's permission cards, answer the first-use system prompts, and fail when the setup shows that recording could not start
---
- scrollUntilVisible:
    element:
      id: setup-start
- tapOn:
    id: setup-start
- repeat:
    times: 4
    commands:
      - extendedWaitUntil:
          visible:
            id: (recorder-time|permission-.*-dialog|com.android.permissioncontroller:id/.*)
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible:
              id: permission-(microphone|notifications)-dialog
          commands:
            - tapOn:
                id: permission-(microphone|notifications)-dialog-confirm
      - runFlow:
          when:
            visible:
              text: (While using the app|Saat aplikasi digunakan)
          commands:
            - tapOn:
                text: (While using the app|Saat aplikasi digunakan)
      - runFlow:
          when:
            visible:
              text: (Allow|Izinkan)
          commands:
            - tapOn:
                text: (Allow|Izinkan)
- assertNotVisible:
    id: setup-outcome
- extendedWaitUntil:
    visible:
      id: recorder-time
    timeout: 30000

appId: io.kaitech.mobile
name: Dismiss the keyboard without the iOS back swipe
---
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - repeat:
          while:
            notVisible:
              id: sign-in-title
          times: 6
          commands:
            - swipe:
                start: 50%, 10%
                end: 50%, 45%
      - tapOn:
          id: sign-in-title

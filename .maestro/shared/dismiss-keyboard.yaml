appId: io.kaitech.mobile
name: Dismiss the keyboard once it is up, without the iOS back swipe
---
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: '(com\.google\.android|com\.android)\.inputmethod\.latin:id/.+'
          timeout: 10000
          optional: true
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - repeat:
          while:
            notVisible:
              id: sign-in-title
          times: 6
          commands:
            - swipe:
                start: 50%, 10%
                end: 50%, 45%
      - tapOn:
          id: sign-in-title

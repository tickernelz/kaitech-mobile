appId: io.kaitech.mobile
name: Sign in on the server page and finish setup when the app is signed out
---
- tapOn:
    id: welcome-sign-in
- extendedWaitUntil:
    visible:
      text: (Email|Sign in to the Kaitech app on this device\?|Masuk ke aplikasi Kaitech di perangkat ini\?)
    timeout: 60000
- runFlow:
    when:
      visible:
        text: (Password|Kata Sandi)
    commands:
      - tapOn:
          text: (Email|Login)
          index: 0
      - inputText: ${LOGIN}
      - runFlow:
          when:
            platform: Android
          commands:
            - hideKeyboard
      - scrollUntilVisible:
          element:
            text: (Password|Kata Sandi)
      - tapOn:
          text: (Password|Kata Sandi)
          index: 0
      - inputText: ${PASSWORD}
      - pressKey: Enter
- extendedWaitUntil:
    visible:
      text: (Sign in to the Kaitech app on this device\?|Masuk ke aplikasi Kaitech di perangkat ini\?)
    timeout: 60000
- scrollUntilVisible:
    element:
      text: (Sign in|Masuk)
- tapOn:
    text: (Sign in|Masuk)
    index: -1
- extendedWaitUntil:
    visible:
      id: setup
    timeout: 60000
- tapOn:
    id: setup-next
- runFlow:
    when:
      visible:
        id: setup-lock-later
    commands:
      - tapOn:
          id: setup-lock-later
- extendedWaitUntil:
    visible:
      id: tab-chat
    timeout: 30000

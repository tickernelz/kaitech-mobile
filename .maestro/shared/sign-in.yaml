appId: io.kaitech.mobile
name: Sign in on the server page and finish setup when the app is signed out
---
- runFlow:
    when:
      platform: Android
    commands:
      - stopApp: com.android.chrome
- tapOn:
    id: welcome-sign-in
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: (Continue|Lanjutkan)
          optional: true
- extendedWaitUntil:
    visible:
      text: (Email|Sign in to the Kaitech app on this device\?|Masuk ke aplikasi Kaitech di perangkat ini\?)
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible:
        id: welcome-sign-in
    commands:
      - tapOn:
          id: welcome-sign-in
      - extendedWaitUntil:
          visible:
            text: (Email|Sign in to the Kaitech app on this device\?|Masuk ke aplikasi Kaitech di perangkat ini\?)
          timeout: 60000
          optional: true
- runFlow:
    when:
      notVisible:
        text: (Email|Sign in to the Kaitech app on this device\?|Masuk ke aplikasi Kaitech di perangkat ini\?)
    commands:
      - runFlow:
          file: screenshot.yaml
          env:
            SCREEN: auth-page-missing
      - assertVisible:
          text: (Email|Sign in to the Kaitech app on this device\?|Masuk ke aplikasi Kaitech di perangkat ini\?)
- runFlow:
    when:
      visible:
        text: (Password|Kata Sandi)
    commands:
      - tapOn:
          text: (Email|Login)
          index: 0
      - inputText: ${LOGIN}
      - runFlow:
          when:
            platform: Android
          commands:
            - hideKeyboard
      - scrollUntilVisible:
          element:
            text: (Password|Kata Sandi)
      - tapOn:
          text: (Password|Kata Sandi)
          index: 0
      - inputText: ${PASSWORD}
      - pressKey: Enter
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                text: (Not Now|Nanti)
                optional: true
- extendedWaitUntil:
    visible:
      text: (Sign in to the Kaitech app on this device\?|Masuk ke aplikasi Kaitech di perangkat ini\?)
    timeout: 60000
- runFlow:
    when:
      notVisible:
        text: .*${LOGIN}.*
    commands:
      - tapOn:
          text: .*(Bukan Anda|Not you|akun lain|another account).*
      - extendedWaitUntil:
          visible:
            text: (Email|Password|Kata Sandi)
          timeout: 60000
      - tapOn:
          text: (Email|Login)
          index: 0
      - inputText: ${LOGIN}
      - hideKeyboard
      - scrollUntilVisible:
          element:
            text: (Password|Kata Sandi)
      - tapOn:
          text: (Password|Kata Sandi)
          index: 0
      - inputText: ${PASSWORD}
      - pressKey: Enter
      - extendedWaitUntil:
          visible:
            text: (Sign in to the Kaitech app on this device\?|Masuk ke aplikasi Kaitech di perangkat ini\?)
          timeout: 60000
- scrollUntilVisible:
    element:
      text: (Sign in|Masuk)
- tapOn:
    text: (Sign in|Masuk)
    index: -1
- extendedWaitUntil:
    visible:
      id: setup
    timeout: 60000
- tapOn:
    id: setup-next
- runFlow:
    when:
      visible:
        id: setup-lock-later
    commands:
      - tapOn:
          id: setup-lock-later
- extendedWaitUntil:
    visible:
      id: tab-chat
    timeout: 30000

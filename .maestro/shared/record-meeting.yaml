appId: io.kaitech.mobile
name: Start recording a new meeting from the MoM tab, answering the first-use permission prompts
---
- tapOn:
    id: tab-button-mom
- extendedWaitUntil:
    visible:
      id: mom-record
    timeout: 60000
- tapOn:
    id: mom-record
- extendedWaitUntil:
    visible:
      id: setup-name
    timeout: 30000
- runFlow:
    file: screenshot.yaml
    env:
      SCREEN: m0-setup
- scrollUntilVisible:
    element:
      id: setup-consent
- tapOn:
    id: setup-consent
- runFlow: start-recording.yaml

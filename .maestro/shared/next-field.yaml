appId: io.kaitech.mobile
name: Move from the server field to the database field on Android, pressing Enter again when the first one moved nothing
---
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: sign-in-database
      focused: true
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible:
        id: sign-in-database
        focused: true
    commands:
      - pressKey: Enter
- extendedWaitUntil:
    visible:
      id: sign-in-database
      focused: true
    timeout: 10000

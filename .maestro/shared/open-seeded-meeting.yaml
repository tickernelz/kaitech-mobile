appId: io.kaitech.mobile
name: Open the seeded test meeting through MoM menu, All minutes, search by its name
---
- tapOn:
    id: tab-button-mom
- repeat:
    while:
      notVisible:
        id: mom-menu
    times: 20
    commands:
      - swipe:
          start: 22%, 30%
          end: 22%, 80%
          duration: 400
- tapOn:
    id: mom-menu
- tapOn:
    id: mom-more-minutes
- extendedWaitUntil:
    visible:
      id: mom-records-search
    timeout: 30000
- tapOn:
    id: mom-records-search
- inputText: ${MINUTES_NAME}
- runFlow: dismiss-keyboard.yaml
- extendedWaitUntil:
    visible:
      id: mom-record-[0-9]+
      text: .*${MINUTES_NAME}.*
    timeout: 30000
- tapOn:
    id: mom-record-[0-9]+
    text: .*${MINUTES_NAME}.*
    index: 0

appId: io.kaitech.mobile
name: Sign another Kaitech app device of this account out from Devices
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: welcome-sign-in
    timeout: 30000
- runFlow: ../shared/sign-in.yaml
- tapOn:
    id: open-settings
- tapOn:
    id: settings-security
- tapOn:
    id: security-devices
- extendedWaitUntil:
    visible:
      id: app-device-[0-9]+
    timeout: 30000
- repeat:
    times: 30
    while:
      notVisible:
        id: app-device-${TARGET}
    commands:
      - scrollUntilVisible:
          element:
            id: (app-device-${TARGET}|app-devices-more)
          timeout: 20000
      - runFlow:
          when:
            notVisible:
              id: app-device-${TARGET}
          commands:
            - tapOn:
                id: app-devices-more
- scrollUntilVisible:
    element:
      id: app-device-${TARGET}
    timeout: 60000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: v1-devices
- tapOn:
    id: app-device-${TARGET}
- tapOn:
    text: (Sign out|Keluarkan)
- extendedWaitUntil:
    notVisible:
      id: app-device-${TARGET}
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: v2-device-out

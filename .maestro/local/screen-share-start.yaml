appId: io.kaitech.mobile
name: Screen share, part 1 - join the web peer's voice call and share the phone screen (local only)
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: (welcome-sign-in|tab-chat|incoming-answer)
    timeout: 30000
- runFlow:
    when:
      visible:
        id: welcome-sign-in
    commands:
      - runFlow: ../shared/sign-in.yaml
- runFlow:
    when:
      visible:
        id: incoming-answer
    commands:
      - tapOn:
          id: incoming-answer
- runFlow:
    when:
      visible:
        id: tab-chat
    commands:
      - tapOn:
          id: tab-button-chat
      - tapOn:
          text: ${PEER}
      - extendedWaitUntil:
          visible:
            id: (call-voice|incoming-answer)
          timeout: 30000
      - runFlow:
          when:
            visible:
              id: incoming-answer
          commands:
            - tapOn:
                id: incoming-answer
      - runFlow:
          when:
            visible:
              id: call-voice
          commands:
            - tapOn:
                id: call-voice
- extendedWaitUntil:
    visible:
      id: call-share
    timeout: 60000
- tapOn:
    id: call-share
- runFlow: ../shared/allow-screen-capture.yaml
- extendedWaitUntil:
    visible:
      id: call-screen-share-own
    timeout: 20000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: s1-sharing

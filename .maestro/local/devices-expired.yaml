appId: io.kaitech.mobile
name: The app shows sign in again once its device was signed out elsewhere
---
- launchApp:
    stopApp: true
- runFlow:
    when:
      visible:
        id: open-settings
    commands:
      - tapOn:
          id: open-settings
      - tapOn:
          id: settings-security
      - tapOn:
          id: security-devices
- extendedWaitUntil:
    visible:
      id: expired
    timeout: 60000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: v3-expired

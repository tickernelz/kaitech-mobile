appId: io.kaitech.mobile
name: MoM upload a meeting file from the phone instead of recording it, then remove that test recording (local only; push zha7442-upload.mp3 to Download first)
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: welcome-sign-in
    timeout: 30000
- runFlow: ../shared/sign-in.yaml
- tapOn:
    id: tab-button-mom
- extendedWaitUntil:
    visible:
      id: mom-record
    timeout: 60000
- tapOn:
    id: mom-record
- extendedWaitUntil:
    visible:
      id: setup-name
    timeout: 30000
- tapOn:
    id: setup-name
- inputText: ${'Uji unggah ' + DEVICE_SIZE + ' ' + APP_LANGUAGE}
- runFlow: ../shared/dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      id: setup-consent
- tapOn:
    id: setup-consent
- scrollUntilVisible:
    element:
      id: setup-upload-file
- tapOn:
    id: setup-upload-file
- extendedWaitUntil:
    visible:
      text: zha7442-upload.mp3
    timeout: 30000
- tapOn:
    text: zha7442-upload.mp3
- extendedWaitUntil:
    visible:
      id: upload-done
    timeout: 180000
- takeScreenshot: u1-uploaded-${DEVICE_SIZE}-${APP_LANGUAGE}
- tapOn:
    text: ${'Uji unggah ' + DEVICE_SIZE + ' ' + APP_LANGUAGE}
    index: 0
- extendedWaitUntil:
    visible:
      id: meeting-more
    timeout: 30000
- tapOn:
    id: meeting-more
- tapOn:
    id: mom-more-assist-notes
- extendedWaitUntil:
    visible:
      id: assist-note-body
    timeout: 30000
- tapOn:
    id: assist-note-body
- inputText: Catatan uji ZHA-7442 dari ponsel
- runFlow: ../shared/dismiss-keyboard.yaml
- tapOn:
    id: assist-note-save
- tapOn:
    id: assist-note-attach
- extendedWaitUntil:
    visible:
      text: zha7442-catatan.txt
    timeout: 30000
- tapOn:
    text: zha7442-catatan.txt
- extendedWaitUntil:
    visible:
      id: note-remove-[0-9]+
    timeout: 60000
- takeScreenshot: u2-notes-${DEVICE_SIZE}-${APP_LANGUAGE}
- tapOn:
    id: note-remove-[0-9]+
- extendedWaitUntil:
    notVisible:
      id: note-remove-[0-9]+
    timeout: 30000
- tapOn:
    id: header-back
- tapOn:
    id: meeting-more
- tapOn:
    id: mom-more-remove-[0-9]+
- extendedWaitUntil:
    visible:
      id: mom-remove-name
    timeout: 30000
- copyTextFrom:
    id: mom-remove-name
- tapOn:
    id: mom-remove-title
- inputText: ${maestro.copiedText}
- tapOn:
    id: mom-remove-password
- inputText: ${PASSWORD}
- runFlow: ../shared/dismiss-keyboard.yaml
- tapOn:
    id: mom-remove-confirm
- extendedWaitUntil:
    notVisible:
      id: mom-remove
    timeout: 30000

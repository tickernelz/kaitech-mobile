appId: io.kaitech.mobile
name: Coworker quick replies - a kt-block reply is drawn as buttons and a tap sends its text (local only)
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: welcome-sign-in
    timeout: 30000
- runFlow: ../shared/sign-in.yaml
- tapOn:
    id: tab-button-discovery
- extendedWaitUntil:
    visible:
      id: programme-summary
    timeout: 60000
- scrollUntilVisible:
    element:
      id: discovery-ask
- tapOn:
    id: discovery-ask
- extendedWaitUntil:
    visible:
      id: coworker-input
    timeout: 10000
- tapOn:
    id: coworker-input
- evalScript: "${output.question = typeof QUESTION === 'undefined' || !QUESTION ? 'E2E check ' + Date.now() + ', answer with a quick-replies block (replies) offering two choices, Ya and Tidak. Is this programme summary complete?' : QUESTION}"
- inputText: ${output.question}
- runFlow: ../shared/dismiss-keyboard.yaml
- tapOn:
    id: coworker-send
- extendedWaitUntil:
    visible:
      id: coworker-reply
    timeout: 300000
- scrollUntilVisible:
    element:
      id: kt-reply-0
    direction: DOWN
    timeout: 60000
- assertNotVisible:
    text: .*"replies".*
- takeScreenshot: r1-replies
- copyTextFrom:
    id: kt-reply-0
- evalScript: ${output.reply = maestro.copiedText}
- tapOn:
    id: kt-reply-0
- extendedWaitUntil:
    visible:
      text: ${output.reply}
      below:
        id: kt-reply-0
    timeout: 30000
- takeScreenshot: r2-reply-sent

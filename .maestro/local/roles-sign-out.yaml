appId: io.kaitech.mobile
name: Switch to a named account and sign it out of this phone
---
- launchApp
- extendedWaitUntil:
    visible:
      id: open-settings
    timeout: 30000
- tapOn:
    id: open-settings
- tapOn:
    id: settings-accounts
- tapOn:
    text: ${NAME}
    index: 0
- tapOn:
    id: settings-back
- extendedWaitUntil:
    visible:
      id: settings-profile
    timeout: 20000
- assertVisible:
    text: ${NAME}
- scrollUntilVisible:
    element:
      id: settings-sign-out
- tapOn:
    id: settings-sign-out
- tapOn:
    id: sign-out-dialog-confirm
- extendedWaitUntil:
    visible:
      id: (tab-chat|tab-home|welcome-sign-in)
    timeout: 30000

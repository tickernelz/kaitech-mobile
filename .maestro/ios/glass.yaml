appId: io.kaitech.mobile
name: iOS Liquid Glass tour, native tab bar, sheets and main screens
tags:
  - ios-glass
onFlowStart:
  - runFlow: ../shared/orientation.yaml
---
- launchApp
- extendedWaitUntil:
    visible:
      id: (welcome-sign-in|tab-chat)
    timeout: 30000
- runFlow:
    when:
      visible:
        id: welcome-sign-in
    commands:
      - runFlow:
          file: ../shared/screenshot.yaml
          env:
            SCREEN: g0-welcome-${APPEARANCE}
      - runFlow: ../shared/sign-in.yaml
- tapOn:
    id: tab-button-chat
- extendedWaitUntil:
    visible:
      id: chat-list
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: g1-chat-${APPEARANCE}
- longPressOn:
    id: conversation-.*
    index: 0
- extendedWaitUntil:
    visible:
      id: row-sheet
    timeout: 10000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: g2-chat-more-${APPEARANCE}
- swipe:
    from:
      id: row-sheet
    direction: DOWN
- extendedWaitUntil:
    notVisible:
      id: row-sheet
    timeout: 10000
- tapOn:
    id: tab-button-discovery
- extendedWaitUntil:
    visible:
      id: tab-discovery
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: g3-discovery-${APPEARANCE}
- tapOn:
    id: tab-button-mom
- extendedWaitUntil:
    visible:
      id: tab-mom
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: g4-mom-${APPEARANCE}
- tapOn:
    id: tab-button-activity
- extendedWaitUntil:
    visible:
      id: tab-activity
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: g5-activity-${APPEARANCE}
- tapOn:
    id: tab-button-chat
- tapOn:
    id: open-search
- extendedWaitUntil:
    visible:
      id: search
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: g6-search-${APPEARANCE}
- tapOn:
    id: search-close
- tapOn:
    id: open-settings
- extendedWaitUntil:
    visible:
      id: settings
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: g7-settings-${APPEARANCE}

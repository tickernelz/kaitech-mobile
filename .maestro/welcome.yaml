appId: io.kaitech.mobile
name: Welcome follows the device language and keeps the chosen one
tags:
  - welcome
onFlowStart:
  - runFlow: shared/orientation.yaml
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: welcome-title
    timeout: 30000
- assertVisible:
    id: welcome-title
    text: "${APP_LANGUAGE === 'id' ? 'Selamat datang di Kaitech' : 'Welcome to Kaitech'}"
- assertVisible:
    id: welcome-sign-in
- assertNotVisible:
    text: .*(Chat|Discovery|MoM).*
- runFlow:
    file: shared/screenshot.yaml
    env:
      SCREEN: welcome
- tapOn:
    id: welcome-language
- assertVisible:
    id: welcome-title
    text: "${APP_LANGUAGE === 'id' ? 'Welcome to Kaitech' : 'Selamat datang di Kaitech'}"
- stopApp
- launchApp
- runFlow: shared/orientation.yaml
- extendedWaitUntil:
    visible:
      id: welcome-title
      text: "${APP_LANGUAGE === 'id' ? 'Welcome to Kaitech' : 'Selamat datang di Kaitech'}"
    timeout: 30000
- runFlow:
    file: shared/screenshot.yaml
    env:
      SCREEN: welcome-switched

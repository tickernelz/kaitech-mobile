appId: io.kaitech.mobile
name: Sign-in opens the default server without fields and checks another server before the browser
tags:
  - sign-in
onFlowStart:
  - runFlow: shared/orientation.yaml
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: welcome-sign-in
    timeout: 30000
- assertNotVisible:
    id: sign-in-server
- runFlow:
    when:
      platform: Android
    commands:
      - retry:
          maxRetries: 2
          commands:
            - runFlow:
                when:
                  notVisible:
                    id: welcome-sign-in
                commands:
                  - back
            - tapOn:
                id: welcome-sign-in
            - extendedWaitUntil:
                visible:
                  text: .*lab0\.kaitech\.io.*
                timeout: 60000
      - assertNotVisible:
          id: sign-in-server
      - runFlow:
          file: shared/screenshot.yaml
          env:
            SCREEN: sign-in-default-browser
      - back
      - extendedWaitUntil:
          visible:
            id: welcome-error
            text: "${APP_LANGUAGE === 'id' ? 'Masuk dibatalkan.' : 'Sign-in was cancelled.'}"
          timeout: 30000
- tapOn:
    id: welcome-other-server
- assertVisible:
    id: sign-in-server
- runFlow:
    file: shared/screenshot.yaml
    env:
      SCREEN: sign-in
- scrollUntilVisible:
    element:
      id: sign-in-continue
- tapOn:
    id: sign-in-continue
- assertVisible:
    id: sign-in-server-error
    text: "${APP_LANGUAGE === 'id' ? 'Masukkan alamat server.' : 'Enter your server address.'}"
- tapOn:
    id: sign-in-server
- inputText: http://erp.example.com
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
      - extendedWaitUntil:
          visible:
            id: sign-in-database
            focused: true
          timeout: 10000
      - pressKey: Enter
      - extendedWaitUntil:
          visible:
            id: sign-in-server-error
            text: "${APP_LANGUAGE === 'id' ? 'Server harus memakai koneksi aman .https..' : 'The server must use a secure connection .https..'}"
          timeout: 10000
      - assertNotVisible:
          id: sign-in-database
          focused: true
- runFlow:
    when:
      platform: iOS
    file: shared/dismiss-keyboard.yaml
- runFlow:
    when:
      true: ${ORIENTATION === 'portrait' && (DEVICE_SIZE === 'phone' || maestro.platform === 'ios')}
    commands:
      - setOrientation: LANDSCAPE_LEFT
      - assertVisible:
          id: sign-in-server
          text: http://erp.example.com
      - setOrientation: PORTRAIT
- runFlow:
    when:
      true: ${ORIENTATION === 'landscape' && (DEVICE_SIZE === 'phone' || maestro.platform === 'ios')}
    commands:
      - setOrientation: PORTRAIT
      - assertVisible:
          id: sign-in-server
          text: http://erp.example.com
      - setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: sign-in-server
    text: http://erp.example.com
- scrollUntilVisible:
    element:
      id: sign-in-continue
- tapOn:
    id: sign-in-continue
- assertVisible:
    id: sign-in-server-error
    text: "${APP_LANGUAGE === 'id' ? 'Server harus memakai koneksi aman .https..' : 'The server must use a secure connection .https..'}"
- runFlow:
    file: shared/screenshot.yaml
    env:
      SCREEN: sign-in-error
- tapOn:
    id: sign-in-server
- eraseText: 40
- inputText: erp.example.com
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
      - extendedWaitUntil:
          visible:
            id: sign-in-database
            focused: true
          timeout: 10000
      - inputText: erp main
      - pressKey: Enter
      - extendedWaitUntil:
          visible:
            id: sign-in-database-error
          timeout: 10000
      - assertNotVisible:
          id: sign-in-database
          focused: true
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow: shared/dismiss-keyboard.yaml
      - tapOn:
          id: sign-in-database
      - inputText: erp main
      - runFlow: shared/dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      id: sign-in-continue
- tapOn:
    id: sign-in-continue
- assertVisible:
    id: sign-in-database-error
    text: "${APP_LANGUAGE === 'id' ? 'Nama basis data belum benar.' : 'That doesn.t look like a database name.'}"
- runFlow:
    file: shared/screenshot.yaml
    env:
      SCREEN: sign-in-database-error
- scrollUntilVisible:
    element:
      id: sign-in-use-default
- tapOn:
    id: sign-in-use-default
- assertVisible:
    id: sign-in-default
- assertNotVisible:
    id: sign-in-server
- scrollUntilVisible:
    element:
      id: sign-in-back
- tapOn:
    id: sign-in-back
- assertVisible:
    id: welcome-title

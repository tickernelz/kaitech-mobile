appId: io.kaitech.mobile
name: Sign-in form checks the server address before opening the browser
tags:
  - sign-in
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: welcome-sign-in
    timeout: 30000
- tapOn:
    id: welcome-sign-in
- assertVisible:
    id: sign-in-server
- tapOn:
    id: sign-in-continue
- assertVisible:
    id: sign-in-server-error
    text: "${APP_LANGUAGE === 'id' ? 'Masukkan alamat server.' : 'Enter your server address.'}"
- tapOn:
    id: sign-in-server
- inputText: http://erp.example.com
- hideKeyboard
- tapOn:
    id: sign-in-continue
- assertVisible:
    id: sign-in-server-error
    text: "${APP_LANGUAGE === 'id' ? 'Server harus memakai koneksi aman .https..' : 'The server must use a secure connection .https..'}"
- takeScreenshot: sign-in-error-${APP_LANGUAGE}
- back
- assertVisible:
    id: welcome-title

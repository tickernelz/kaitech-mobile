appId: io.kaitech.mobile
name: Release APK launches to the first screen
env:
  APP_LANGUAGE: en
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: app-root
    timeout: 30000
- assertVisible: Kaitech
- assertVisible:
    id: app-greeting
    text: ${APP_LANGUAGE === 'id' ? 'Selamat datang' : 'Welcome'}
- takeScreenshot: launch-${APP_LANGUAGE}

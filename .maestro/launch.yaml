appId: io.kaitech.mobile
name: Release APK launches to the first screen
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: app-root
    timeout: 30000
- assertVisible: Kaitech
- assertVisible:
    id: app-greeting
    text: "${APP_LANGUAGE === 'id' ? 'Selamat datang' : 'Welcome'}"
- runFlow:
    file: shared/screenshot.yaml
    env:
      SCREEN: launch

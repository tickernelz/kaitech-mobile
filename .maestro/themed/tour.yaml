appId: io.kaitech.mobile
name: Main screens, the More sheet and settings in the current system theme
tags:
  - signed-in
onFlowStart:
  - runFlow: ../shared/orientation.yaml
---
- launchApp
- extendedWaitUntil:
    visible:
      id: (welcome-sign-in|tab-chat)
    timeout: 30000
- runFlow:
    when:
      visible:
        id: welcome-sign-in
    commands:
      - runFlow: ../shared/sign-in.yaml
- tapOn:
    id: tab-button-chat
- extendedWaitUntil:
    visible:
      id: chat-list
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: ${THEME}-t1-chat
- longPressOn:
    id: conversation-.*
    index: 0
- extendedWaitUntil:
    visible:
      id: row-sheet
    timeout: 10000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: ${THEME}-t2-chat-more
- back
- extendedWaitUntil:
    notVisible:
      id: row-sheet
    timeout: 10000
- tapOn:
    id: tab-button-discovery
- extendedWaitUntil:
    visible:
      id: tab-discovery
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: ${THEME}-t3-discovery
- tapOn:
    id: tab-button-mom
- extendedWaitUntil:
    visible:
      id: tab-mom
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: ${THEME}-t4-mom
- tapOn:
    id: tab-button-activity
- extendedWaitUntil:
    visible:
      id: tab-activity
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: ${THEME}-t5-activity
- tapOn:
    id: open-settings
- extendedWaitUntil:
    visible:
      id: settings
    timeout: 30000
- runFlow:
    file: ../shared/screenshot.yaml
    env:
      SCREEN: ${THEME}-t6-settings
